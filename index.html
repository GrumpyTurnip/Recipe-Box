<title>Recipe Box</title>
<style>
  :root{
    --paper:#EDE4D3;
    --card:#FBF8F1;
    --ink:#2E2115;
    --ink-soft:#5C4E3D;
    --basil:#4A6741;
    --basil-dark:#374d30;
    --mustard:#D9A441;
    --brick:#B84A3E;
    --line:#D9CBAE;
    --shadow: 0 2px 0 rgba(46,33,21,0.08), 0 8px 20px -12px rgba(46,33,21,0.35);
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --font-serif: ui-serif, Georgia, "Times New Roman", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-sans);
    background-image: radial-gradient(circle at 1px 1px, rgba(46,33,21,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--paper);}
  body{min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
  .app{max-width:1000px;margin:0 auto;padding:24px 20px 80px;
    padding-top:max(24px,env(safe-area-inset-top));
    padding-right:max(20px,env(safe-area-inset-right));
    padding-bottom:calc(80px + env(safe-area-inset-bottom));
    padding-left:max(20px,env(safe-area-inset-left));}

  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:44px;height:44px;border-radius:6px;background:var(--basil);
    display:flex;align-items:center;justify-content:center;color:var(--card);
    font-family:var(--font-mono);font-weight:700;font-size:18px;
    box-shadow:var(--shadow);transform:rotate(-3deg);
  }
  .brand h1{font-family:var(--font-mono);font-size:22px;margin:0;letter-spacing:-0.5px;}
  .brand p{margin:0;font-size:12px;color:var(--ink-soft);}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;}

  nav.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:2px solid var(--line);}
  nav.tabs button{
    font-family:var(--font-mono);font-size:13px;padding:10px 16px;
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    border-bottom:3px solid transparent;margin-bottom:-2px;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--brick);font-weight:700;}

  button{font-family:var(--font-sans);}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;border-radius:5px;border:1.5px solid var(--ink);
    background:var(--card);color:var(--ink);font-size:13px;font-weight:600;
    cursor:pointer;
  }
  .btn:hover{filter:brightness(0.97);}
  .btn-primary{background:var(--basil);border-color:var(--basil-dark);color:#fff;}
  .btn-accent{background:var(--mustard);border-color:#a97c26;color:var(--ink);}
  .btn-danger{background:var(--brick);border-color:#7c2f26;color:#fff;}
  .btn-ghost{background:transparent;border-color:var(--line);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  input[type=text],input[type=email],input[type=number],input[type=url],input[type=password],textarea,select{
    font-family:var(--font-sans);font-size:13px;padding:8px 10px;
    border:1.5px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);width:100%;
  }
  textarea{resize:vertical;}
  label.field{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);margin-bottom:4px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .toolbar input[type=text]{max-width:240px;}
  .chip{
    font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:14px;
    border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink-soft);
  }
  .chip.active{background:var(--ink);color:var(--card);border-color:var(--ink);}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .rcard{
    background:var(--card);border-radius:8px;box-shadow:var(--shadow);cursor:pointer;
    overflow:hidden;position:relative;border:1px solid var(--line);
  }
  .rcard .cover{height:130px;background:var(--basil);background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-mono);font-size:12px;text-align:center;padding:8px;}
  .rcard .body{padding:12px 14px 14px;}
  .rcard h3{font-family:var(--font-serif);font-size:17px;margin:0 0 6px;line-height:1.25;}
  .rcard .meta{font-size:11px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;}
  .tagpill{
    font-size:9.5px;font-family:var(--font-mono);text-transform:uppercase;
    padding:2px 6px;border-radius:3px;background:var(--mustard);color:var(--ink);
  }
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty h3{font-family:var(--font-serif);font-size:20px;color:var(--ink);margin-bottom:6px;}

  .detail-header{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:20px;}
  .detail-cover{width:260px;height:180px;border-radius:8px;background:var(--basil);background-size:cover;background-position:center;box-shadow:var(--shadow);flex-shrink:0;}
  .detail-info{flex:1;min-width:200px;}
  .detail-info h2{font-family:var(--font-serif);font-size:30px;margin:0 0 8px;}
  .back-link{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;margin-bottom:14px;padding:0;font-family:var(--font-mono);}
  .back-link:hover{color:var(--ink);}

  .card-block{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px;}
  .card-block h4{font-family:var(--font-mono);font-size:13px;text-transform:uppercase;letter-spacing:0.5px;margin:0 0 12px;color:var(--basil-dark);}
  .ing-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px;}
  .ing-row:last-child{border-bottom:none;}
  .steps-list{margin:0;padding-left:0;list-style:none;}
  .steps-list li{display:flex;gap:12px;margin-bottom:14px;font-size:14px;line-height:1.5;}
  .step-num{font-family:var(--font-mono);font-weight:700;color:var(--mustard);background:var(--ink);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
  .steps-list.bullets li{align-items:center;}
  .steps-list.bullets .step-num{background:none;color:var(--ink);}
  .steps-list.bullets .step-num::before{content:'\2022';font-size:20px;}

  .photo-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .photo-strip img{width:80px;height:80px;object-fit:cover;border-radius:5px;border:1px solid var(--line);}

  .overlay{position:fixed;inset:0;background:rgba(46,33,21,0.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--card);border-radius:10px;max-width:640px;width:100%;padding:26px 26px 22px;box-shadow:var(--shadow);}
  .modal h3{font-family:var(--font-serif);font-size:22px;margin:0 0 16px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
  .grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;}
  .field-group{margin-bottom:14px;}
  .list-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .add-mode-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .add-mode-tabs button{flex:1;}

  .dropzone{
    border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;
    cursor:pointer;color:var(--ink-soft);font-size:13px;display:block;
  }
  .dropzone:hover{border-color:var(--basil);}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:5px;}

  .status-line{font-size:12px;color:var(--ink-soft);margin-top:8px;display:flex;align-items:center;gap:6px;}
  .spinner{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--basil);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-line{color:var(--brick);font-size:12px;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media(max-width:720px){.two-col{grid-template-columns:1fr;} .grid3{grid-template-columns:1fr;}}
  .list-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .list-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--basil);}
  .list-item.checked{color:var(--ink-soft);text-decoration:line-through;}
  .pantry-tag{margin-left:auto;font-size:10px;color:var(--ink-soft);font-family:var(--font-mono);flex-shrink:0;}
  .small-x{background:none;border:none;color:var(--brick);cursor:pointer;font-size:15px;padding:0 4px;}

  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:26px;max-width:380px;width:100%;}
  .login-title{font-family:var(--font-serif);font-size:22px;margin:0 0 14px;}
  .sync-chip{font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink-soft);}
  .sync-chip.ok{border-color:var(--basil);color:var(--basil-dark);}
  .sync-chip.err{border-color:var(--brick);color:var(--brick);}
  .sync-chip.busy{border-style:dashed;}
  pre.rules{background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:10px;font-size:11px;overflow-x:auto;-webkit-user-select:all;user-select:all;margin:6px 0 12px;font-family:var(--font-mono);}
  details.setup summary{cursor:pointer;font-weight:600;font-size:13px;margin-bottom:8px;}
  details.setup ol{font-size:13px;line-height:1.55;padding-left:20px;margin:6px 0 10px;}
  .notice{font-size:12px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin:8px 0;}
  .notice.err{border-color:var(--brick);color:var(--brick);}
  .list-row .btn{white-space:nowrap;flex-shrink:0;}
  .to-pantry{margin-left:auto;white-space:nowrap;}
  .to-pantry + .small-x{margin-left:6px;}
  .detail-meta{margin:2px 0 8px;}
  .meta-chip{display:inline-block;font-size:12px;color:var(--ink-soft);background:var(--paper-2, #f1ece3);border-radius:999px;padding:2px 10px;margin:0 6px 6px 0;white-space:nowrap;}
  .rcard .meta-chip{font-size:11px;padding:1px 8px;margin:0 4px 4px 0;}
  .more-opts{margin-top:18px;padding-top:12px;border-top:1px solid var(--line, #ddd);}
  .more-opts h4{margin:0 0 4px;font-size:13px;}
  .orig-banner{background:#e8f0e4;border:1px solid var(--sage, #7a9a6e);padding:10px 12px;border-radius:6px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .banner{background:#f7dbd7;border:1px solid var(--brick);padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:14px;}
  footer.tip{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:40px;}

  .app,.modal,.card-block,.rcard,.detail-info{overflow-wrap:anywhere;}
  .login-wrap{padding:16px 0;}
  .print-only{display:none;}
  .step-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;position:relative;background:var(--card);border-radius:6px;}
  .step-row.dragging{z-index:5;box-shadow:var(--shadow);opacity:.96;}
  .step-row.drop-above{box-shadow:0 -3px 0 var(--brick);}
  .step-row.drop-below{box-shadow:0 3px 0 var(--brick);}
  .reorder{display:flex;align-items:center;gap:3px;flex-shrink:0;}
  .drag-h{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px;line-height:1;color:var(--ink-soft);padding:6px 3px;}
  .drag-h:active{cursor:grabbing;}
  .mv-col{display:flex;flex-direction:column;gap:2px;}
  .mv{background:var(--paper);border:1px solid var(--line);border-radius:4px;width:28px;height:22px;font-size:10px;line-height:1;cursor:pointer;padding:0;color:var(--ink);}
  .mv:disabled{opacity:.3;cursor:default;}
  .nl-line{border-bottom:1.2px dotted #555;height:9mm;}
  .nl-label{font-size:11px;font-style:italic;color:var(--ink-soft);margin-top:10px;}
  @media print{
    html,body{background:#fff !important;}

<script>
window.addEventListener('error', function(e){
  var root = document.getElementById('root');
  if(!root || root.getAttribute('data-showing-error') || root.getAttribute('data-ready')) return;
  root.setAttribute('data-showing-error', '1');
  var msg = (e && e.message) ? e.message : 'Unknown error';
  var detail = (e && e.filename) ? (msg + '\n(' + e.filename + ':' + e.lineno + ':' + e.colno + ')') : msg;
  root.innerHTML = '<div style="padding:24px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;">' +
    '<strong>Recipe Box hit an error and couldn\'t load.</strong>\n\nPlease send this to Claude so it can be fixed:\n\n' +
    String(detail).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>';
});
window.addEventListener('unhandledrejection', function(e){
  var root = document.getElementById('root');
  if(!root || root.getAttribute('data-showing-error') || root.getAttribute('data-ready')) return;
  root.setAttribute('data-showing-error', '1');
  var reason = e && e.reason;
  var msg = (reason && reason.message) ? reason.message : String(reason);
  root.innerHTML = '<div style="padding:24px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;">' +
    '<strong>Recipe Box hit an error and couldn\'t load.</strong>\n\nPlease send this to Claude so it can be fixed:\n\n' +
    String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>';
});
</script>

function resizeImage(file, maxW, quality){
  maxW = maxW || 900; quality = quality || 0.75;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));

      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  ];

    if(i >= attempts.length) return Promise.reject(new Error("RAW_FETCH_FAILED"));
    return attempts[i]().then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }).catch(function(){ return tryAttempt(i+1); });
  }
  return tryAttempt(0);
}

var FRAC = '\u00bc\u00bd\u00be\u2150-\u215e';
var UNIT_WORDS = "cups?|tbsps?|tablespoons?|tsps?|teaspoons?|g|grams?|kg|kilograms?|ml|millilitres?|milliliters?|l|litres?|liters?|oz|ounces?|lbs?|pounds?|cloves?|slices?|pinch(?:es)?|cans?|tins?|packets?|sprigs?|bunch(?:es)?|handfuls?|dash(?:es)?|knobs?|sticks?|stalks?|rashers?|fillets?|squeezes?|splash(?:es)?|drizzles?|glugs?";

function heuristicParseRecipeText(text){

    .map(function(l){ return cleanMarkdownLine(l.trim()); })
    .filter(function(l){

/* parse schema.org Recipe JSON-LD embedded in a page */
function findRecipeInJsonLd(node){
  if(!node) return null;

    for(var i=0;i<node.length;i++){

  var isRecipe = type === "Recipe" || (Array.isArray(type) && type.indexOf("Recipe") > -1);

  var ingredientsRaw = recipe.recipeIngredient || recipe.ingredients || [];
  var ingredients = ingredientsRaw.map(parseIngredientLine).filter(function(i){ return i.name; });
  var steps = jsonLdInstructionsToSteps(recipe.recipeInstructions);
  var title = recipe.name || "";
  var image = jsonLdImageToUrl(recipe.image);

}

var TIME_RE = /\b\d+(?:\s*[\u2013-]\s*\d+)?\s*(?:minutes?|mins?|hours?|hrs?|seconds?|secs?)\b|\b\d{2,3}\s*\u00b0\s*[CF]?|\b\d{2,3}\s*(?:\u00b0\s*)?[CF]\b|\bgas mark\s*\d+\b|\b\d{2,3}\s*degrees\b/gi;

  var m = String(text).match(/[^.!?]+(?:[.!?]+(?=\s|$)|$)/g) || [String(text)];

/* no-AI quick version: keep the action and anything with a time or temperature, drop padding, then merge short neighbours */
function localQuickSteps(recipe){
  var steps = (recipe.steps || []).map(function(step){
    var sentences = splitSentences(step);
    if(sentences.length <= 1) return step;
    var keep = [sentences[0]];
    sentences.slice(1).forEach(function(sn){
      if(FILLER_START_RE.test(sn)) return;
      if(stepHasTimingOrTemp(sn)) keep.push(sn);
    });
    return keep.join(' ');

  steps.forEach(function(st){
    var prev = out[out.length - 1];
    if(prev && steps.length > 4 && (prev.length + st.length) <= 140 && out.length >= Math.ceil(steps.length / 2)) out[out.length - 1] = prev + ' ' + st;

/* opts: {prompt: string, images: [{mediaType, base64}], useWebSearch: bool} */
function runAI(opts){
  var prompt = opts.prompt;
  var maxTokens = opts.maxTokens || 1500;
  var images = opts.images || [];
  var useWebSearch = !!opts.useWebSearch;
  var active = getActiveProvider();

  if(active.mode === "none"){
    return Promise.reject(new Error("NO_API_ACCESS"));
  }

  var isAnthropic = (active.mode === "builtin") || (active.mode === "custom" && active.provider === "anthropic");

  if(isAnthropic){
    var content = images.map(function(img){
      return { type: "image", source: { type: "base64", media_type: img.mediaType, data: img.base64 } };
    }).concat([{ type: "text", text: prompt }]);
    var messages = [{ role: "user", content: images.length ? content : prompt }];
    var body = { model: (active.mode === "custom" ? (active.model || "claude-sonnet-5") : "claude-sonnet-4-6"), max_tokens: maxTokens, messages: messages };
    if(useWebSearch) body.tools = [{ type: "web_search_20250305", name: "web_search" }];

    var headers = { "Content-Type": "application/json" };
    if(active.mode === "custom"){
      headers["x-api-key"] = active.apiKey;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    }
    return fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: headers, body: JSON.stringify(body) })
      .catch(function(err){ var e = new Error("NO_API_ACCESS"); e.cause = err; throw e; })
      .then(function(res){
        if(active.mode === "builtin" && (res.status === 401 || res.status === 403)) throw new Error("NO_API_ACCESS");
        if(!res.ok){
          return res.json().catch(function(){ return null; }).then(function(errData){
            var msg = errData && errData.error && errData.error.message ? errData.error.message : ("API error " + res.status);
            throw new Error(msg);
          });
        }
        return res.json();
      }).then(function(data){
        return data.content.filter(function(b){ return b.type === "text"; }).map(function(b){ return b.text; }).join("\n");
      });
  }

  /* custom OpenAI */
  var oContent = images.map(function(img){
    return { type: "image_url", image_url: { url: "data:" + img.mediaType + ";base64," + img.base64 } };
  }).concat([{ type: "text", text: prompt }]);
  var oMessages = [{ role: "user", content: images.length ? oContent : prompt }];
  var oModel = useWebSearch ? "gpt-4o-search-preview" : (active.model || "gpt-4o");
  var oBody = { model: oModel, max_tokens: maxTokens, messages: oMessages };
  if(useWebSearch) oBody.web_search_options = {};
  return fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + active.apiKey },
    body: JSON.stringify(oBody)
  }).catch(function(err){ var e = new Error("NO_API_ACCESS"); e.cause = err; throw e; })
    .then(function(res){
      if(!res.ok){
        return res.json().catch(function(){ return null; }).then(function(errData){
          var msg = errData && errData.error && errData.error.message ? errData.error.message : ("API error " + res.status);
          throw new Error(msg);
        });
      }
      return res.json();
    }).then(function(data){
      return (data.choices && data.choices[0] && data.choices[0].message) ? data.choices[0].message.content : "";
    });
}

var NO_API_MESSAGE = "AI-powered import needs API access. That happens automatically while this file is open inside Claude's chat interface \u2014 outside of it, add your own Claude or OpenAI API key in Settings to keep using this, or use \u201cType it in\u201d instead.";

/* Inserts (amount unit) after the first mention of each ingredient name across the steps */
function setMethodLevel(r, level){
  ui.detailNote = "";

  var key = level === "quick" ? "stepsQuick" : "stepsGuided";
  var ai = getActiveProvider().mode !== "none";
  var upgradeLocal = ai && level === "quick" && r.quickSource === "local";   /* a no-AI quick version gets upgraded once AI is available */
  if(r[key] && r[key].length && !upgradeLocal){ ui.detailLevelOverride = level; render(); return; }
  if(level === "guided" && !ai){
    ui.detailNote = "The guided version is written by AI. Add your API key in Settings (or open this inside Claude) to switch it on.";
    render(); return;
  }
  if(!ai){
    r.stepsQuick = localQuickSteps(r); r.quickSource = "local";
    ui.detailLevelOverride = "quick";
    ui.detailNote = "Shortened without AI (kept the first action of each step and every timing, and joined small steps). Add an API key in Settings for a smarter rewrite.";
    saveState(); return;
  }

  render();
  var gen = level === "quick" ? generateQuickSteps(r) : generateGuidedSteps(r);
  gen.then(function(steps){
    r[key] = steps; if(level === "quick") r.quickSource = "ai";
    ui.summarizeLoadingId = null; ui.detailLevelOverride = level;
    saveState();
  }).catch(function(err){
    ui.summarizeLoadingId = null;
    if(level === "quick"){
      r.stepsQuick = localQuickSteps(r); r.quickSource = "local";
      ui.detailLevelOverride = "quick";
      ui.detailNote = "The AI wasn't reachable, so this is a simple shortening instead. Tap Regenerate to try the AI again.";
      saveState();
    } else {
      ui.detailNote = friendlyErrorMessage(err, "Couldn't write the guided version right now. Try again in a moment.");
      render();
    }
  });
}

/* the ways a step might refer to an ingredient: "small red onion, sliced" -> small red onion / red onion / onion */
function ingredientCoreName(name){
  return String(name || "").replace(/\([^)]*\)/g, ' ').split(/[,;]/)[0].replace(/\s+/g, ' ').trim()
    .replace(/^(?:a|an|the|some|fresh|freshly|large|small|medium|big)\s+/i, '').trim();
}

function ingredientCandidates(ing, all){
  var out = [], full = String(ing.name || "").trim(), core = ingredientCoreName(full);
  [full, core].forEach(function(c){ if(c && out.indexOf(c) === -1) out.push(c); });
  var words = core.split(' ');
  for(var k = 1; k < words.length; k++){
    var tail = words.slice(k).join(' ');
    if(tail.length < 3) continue;
    if(tail.indexOf(' ') === -1){
      /* a lone word like "oil" or "onion" only counts if no other ingredient ends the same way */
      var clash = (all || []).some(function(o){ return o !== ing && new RegExp('(?:^|\\s)' + escapeRegex(tail) + '(?:s|es)?$', 'i').test(ingredientCoreName(o.name)); });
      if(clash) continue;

}
function nameRegex(name, tailAfter){

}

  var ings = (recipe.ingredients || []).filter(function(i){ return i.name && String(i.name).trim() && ingredientQtyText(i); });
  var cands = ings.map(function(ing){ return ingredientCandidates(ing, ings); });
  var seen = {};
  return steps.map(function(step){
    var result = step;
    ings.forEach(function(ing, idx){
      if(seen[idx]) return;
      var qty = ingredientQtyText(ing);
      for(var c = 0; c < cands[idx].length; c++){
        var re = nameRegex(cands[idx][c], '(?!\\s*\\()');   /* skip if a bracket already follows */
        var m = re.exec(result);
        if(m){
          seen[idx] = true;
          result = result.slice(0, m.index + m[0].length) + ' (' + qty + ')' + result.slice(m.index + m[0].length);
          return;
        }
        /* already written in by hand or by an earlier tool? count it as done so it isn't doubled up later */
        if(nameRegex(cands[idx][c], '\\s*\\(').test(result)){ seen[idx] = true; return; }

  });

/* remove quantities written into the method text itself, e.g. "olive oil (3 tbsp)" -> "olive oil" (the app adds them on demand) */

  var out = steps.map(function(step){
    var res = step;
    ings.forEach(function(ing){
      var qtyRe = escapeRegex(String(ing.amount || "").trim()) + (ing.unit ? '\\s*' + escapeRegex(String(ing.unit).trim()) : '');
      ingredientCandidates(ing, ings).forEach(function(c){
        var re = new RegExp('(\\b' + escapeRegex(c) + '(?:s|es)?)\\s*\\(\\s*' + qtyRe + '\\s*\\)', 'ig');
        res = res.replace(re, function(m, name){ removed++; return name; });

  return { steps: out, removed: removed };

function stepsPromptList(recipe){

}
function generateQuickSteps(recipe){

    "- Merge related steps and drop descriptive padding, but keep every essential action.\n" +

    "- Aim for about half the steps (never fewer than 3 unless the original has fewer), each under about 25 words, starting with a verb.\n" +
    "- Do not invent anything that isn't in the original.\n" +

/* ---------- tidy up / consolidate ---------- */
var UNIT_NORM = {tablespoon:'tbsp',tablespoons:'tbsp',tbsps:'tbsp',tbs:'tbsp',tbl:'tbsp',teaspoon:'tsp',teaspoons:'tsp',tsps:'tsp',
  gram:'g',grams:'g',gm:'g',gms:'g',kilogram:'kg',kilograms:'kg',kilo:'kg',kilos:'kg',millilitre:'ml',millilitres:'ml',milliliter:'ml',milliliters:'ml',mls:'ml',

function normUnitStr(u){

}
var FRAC_VAL = { '\u00bc': .25, '\u00bd': .5, '\u00be': .75, '\u2153': 1/3, '\u2154': 2/3, '\u215b': .125 };

  if((m = a.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return parseInt(m[1], 10) + parseInt(m[2], 10) / parseInt(m[3], 10);
  if((m = a.match(/^(\d+)\/(\d+)$/))) return parseInt(m[1], 10) / parseInt(m[2], 10);

    if(Math.abs(frac - table[i][0]) < 0.02){

function tidyText(t){ return String(t == null ? "" : t).replace(/\s+/g, ' ').trim(); }

        if(a !== null && b !== null) prev.amount = formatAmountNum(a + b);

  });

  if(unitFixes) changes.push('Standardised units on ' + unitFixes + ' ingredient' + (unitFixes === 1 ? '' : 's') + ' (e.g. tablespoons \u2192 tbsp)');

  var byName = {};
  out.forEach(function(i){ var k = i.name.toLowerCase().replace(/\([^)]*\)/g, '').trim(); (byName[k] = byName[k] || []).push(i); });
  Object.keys(byName).forEach(function(k){ if(byName[k].length > 1) changes.push('\u201c' + k + '\u201d is listed more than once with different units \u2014 worth a look'); });

  /* steps */
  var numStripped = 0, punct = 0, caps = 0, dupes = 0, joined = 0, split = 0;
  var steps = [], seen = {};
  (rec.steps || []).forEach(function(raw){
    var st = tidyText(raw);
    var st2 = st.replace(/^(?:step\s*)?\d+\s*[.):\-]\s+/i, '').replace(/^[\u2022*\-]\s+/, '');
    if(st2 !== st){ numStripped++; st = st2; }
    if(!st) return;
    if(/^[a-z]/.test(st)){ st = st.charAt(0).toUpperCase() + st.slice(1); caps++; }
    if(/[A-Za-z0-9)\u00bd]$/.test(st)){ st += '.'; punct++; }
    var key = st.toLowerCase();
    if(seen[key]){ dupes++; return; }
    seen[key] = true;
    steps.push(st);
  });
  var combined = [];
  steps.forEach(function(st, i){
    if(combined.length && st.length < 14 && !/\d/.test(st)){ combined[combined.length - 1] += ' ' + st; joined++; }
    else combined.push(st);
  });
  var finalSteps = [];
  combined.forEach(function(st){
    var sentences = splitSentences(st);
    if(st.length > 320 && sentences.length >= 2){
      var chunk = '';
      sentences.forEach(function(sn){
        if(chunk && (chunk + ' ' + sn).length > 240){ finalSteps.push(chunk); chunk = sn; }
        else chunk = chunk ? chunk + ' ' + sn : sn;
      });
      if(chunk) finalSteps.push(chunk);
      split++;
    } else finalSteps.push(st);
  });
  var sb = stripBakedQuantities(finalSteps, (rec.ingredients || []).concat((rec.ingredients || []).map(function(i){ return { name: i.name, amount: i.amount, unit: normUnitStr(i.unit) }; }), out));   /* original amounts too: a merged total no longer matches the old "(2 tbsp)" */
  finalSteps = sb.steps;
  if(sb.removed) changes.push('Took ' + sb.removed + ' quantit' + (sb.removed === 1 ? 'y' : 'ies') + ' out of the method text \u2014 they show automatically when \u201cQuantities in method\u201d is on');
  if(numStripped) changes.push('Removed step numbering from ' + numStripped + ' step' + (numStripped === 1 ? '' : 's'));
  if(dupes) changes.push('Removed ' + dupes + ' repeated step' + (dupes === 1 ? '' : 's'));
  if(joined) changes.push('Joined ' + joined + ' very short step' + (joined === 1 ? '' : 's') + ' onto the one before');
  if(split) changes.push('Split ' + split + ' very long step' + (split === 1 ? '' : 's') + ' into easier chunks');
  if(punct || caps) changes.push('Tidied punctuation and capitals in the method');

  var tags = (rec.tags || []).filter(function(t, i, a){ return a.indexOf(t) === i; });
  return { title: title, ingredients: out, steps: finalSteps, tags: tags, changes: changes };
}

function generateTidyAI(rec){
  var ing = (rec.ingredients||[]).map(function(i){ return [i.amount, i.unit, i.name].filter(Boolean).join(' '); }).join("\n");
  var prompt = "Tidy up and consolidate this recipe.\n" +
    "- Fix spelling and typos; make wording consistent and clear.\n" +
    "- Use metric-style abbreviations for units (g, kg, ml, l, tbsp, tsp).\n" +
    "- Merge duplicate ingredients (add the amounts if the units match).\n" +
    "- Merge fragmentary steps and split any overlong step; remove numbering and filler; keep every timing and temperature.\n" +
    "- Do NOT invent ingredients, quantities or steps, and do not change the dish.\n" +
    "- Do not write ingredient quantities into the steps (no \"(2 tbsp)\" style brackets): the app adds them automatically when the reader switches that option on.\n" +
    "\n" +
    "Title: " + rec.title + "\nIngredients:\n" + ing + "\nSteps:\n" + stepsPromptList(rec) + "\n\n" +
    "Respond with ONLY valid JSON, no markdown fences, no preamble: " +
    '{"title": "...", "ingredients": [{"name":"...","amount":"...","unit":"..."}], "steps": ["...","..."]}';
  return runAI({ prompt: prompt, images: [], useWebSearch: false, maxTokens: 3500 }).then(function(text){
    var p = parseJsonLoose(text);
    var ings = ((p && p.ingredients) || []).map(toIngredientObj).filter(Boolean);
    var steps = stripBakedQuantities(toStepStrings(p && p.steps), ings.length ? ings : rec.ingredients).steps;
    if(!ings.length && !steps.length) throw new Error("The tidy-up came back empty \u2014 please try again.");
    return { title: (p.title || rec.title || "").toString(), ingredients: ings, steps: steps, tags: rec.tags || [] };
  });
}

function autoFindCoverPhoto(title){
  var prompt = "Find one good, directly-linkable photo URL of the dish \"" + title + "\" suitable as a recipe cover image " +
    "(a real food photo, ideally hosted on a recipe or food site, ending in a normal image extension where possible). " +
    "Respond with ONLY valid JSON, no markdown fences, no preamble: {\"imageUrl\": \"https://...\"} or {\"imageUrl\": null} if nothing suitable is found.";
  return runAI({ prompt: prompt, images: [], useWebSearch: true }).then(function(text){

  });

var COVER_STOP = ["with","and","the","recipe","easy","quick","best","simple","homemade","style","from","your","for","that"];
function coverWords(t){
  return String(t || "").toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(function(w){ return w.length >= 4 && COVER_STOP.indexOf(w) === -1; });
}
function fetchJsonCors(url){
  return fetch(url, { mode: 'cors' }).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function absUrl(u, base){ try{ return new URL(u, base).href; }catch(e){ return null; } }

/* 1. the recipe's own web page (when it came from a link) */
function coverFromSource(rec){
  var src = rec.originalUrl;
  if(!src || !/^https?:/i.test(src) || /youtube\.com|youtu\.be/i.test(src)) return Promise.resolve([]);
  return fetchRawHtml(src).then(function(html){
    var out = [];
    var rc = extractRecipeFromHtml(html);
    if(rc && rc.image) out.push(absUrl(jsonLdImageToUrl(rc.image) || rc.image, src));
    var m = html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i) || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
    if(m) out.push(absUrl(m[1].replace(/&amp;/g, '&'), src));
    return out.filter(Boolean);
  });
}
/* 2. TheMealDB: free recipe photos, matched on the dish name */
function coverFromMealDb(title){
  var words = coverWords(title);
  if(!words.length) return Promise.resolve([]);
  var queries = [String(title).trim()].concat(words.slice().sort(function(a, b){ return b.length - a.length; }).slice(0, 2));
  var results = [];
  function next(i){
    if(i >= queries.length) return Promise.resolve();
    return fetchJsonCors('https://www.themealdb.com/api/json/v1/1/search.php?s=' + encodeURIComponent(queries[i])).then(function(j){
      (j && j.meals || []).forEach(function(m){
        var hit = coverWords(m.strMeal).filter(function(w){ return words.indexOf(w) > -1; }).length;
        var score = hit / words.length;
        if(m.strMealThumb && (score >= 0.5 || (words.length === 1 && hit === 1))) results.push({ url: m.strMealThumb, score: score });
      });
    }).catch(function(){}).then(function(){ return results.length ? null : next(i + 1); });
  }
  return next(0).then(function(){
    return results.sort(function(a, b){ return b.score - a.score; }).map(function(x){ return x.url; });
  });
}
/* 3. Wikimedia Commons photo search */
function coverFromCommons(title){
  var words = coverWords(title);
  if(!words.length) return Promise.resolve([]);
  var url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch=' +
    encodeURIComponent(String(title).trim() + ' food') + '&prop=imageinfo&iiprop=url|mime|size&iiurlwidth=800';
  return fetchJsonCors(url).then(function(j){
    var pages = (j && j.query && j.query.pages) ? Object.keys(j.query.pages).map(function(k){ return j.query.pages[k]; }) : [];
    return pages.sort(function(a, b){ return (a.index || 0) - (b.index || 0); }).filter(function(p){
      var ii = p.imageinfo && p.imageinfo[0];
      if(!ii || !/^image\/(?:jpeg|png)$/.test(ii.mime) || (ii.width || 0) < 500) return false;
      if(/logo|map|flag|icon|diagram|chart|poster|stamp|coat of arms/i.test(p.title)) return false;
      return coverWords(p.title).some(function(w){ return words.indexOf(w) > -1; });
    }).map(function(p){ return p.imageinfo[0].thumburl || p.imageinfo[0].url; });
  });
}
/* all sources at once, best-first; the AI web search only steps in if nothing else turned up */
function findCoverCandidates(rec){
  var title = String(rec.title || "").trim();
  function safe(p){ return p.catch(function(){ return []; }); }
  return Promise.all([safe(coverFromSource(rec)), safe(coverFromMealDb(title)), safe(coverFromCommons(title))]).then(function(lists){
    var found = [];
    lists.forEach(function(l){ (l || []).forEach(function(u){ if(u && /^https?:/i.test(u) && found.indexOf(u) === -1) found.push(u); }); });
    if(found.length || getActiveProvider().mode === "none") return found;
    return autoFindCoverPhoto(title).then(function(u){ return u ? [u] : []; }).catch(function(){ return []; });
  });
}
/* keep a copy inside the recipe where possible, so the picture can't vanish if the site changes */
function toLocalCover(url){
  return fetch(url, { mode: 'cors' }).then(function(r){ if(!r.ok) throw new Error('x'); return r.blob(); })
    .then(function(b){ return resizeImage(b, 700, 0.72); })
    .then(function(dataUrl){ return { cover: dataUrl, web: false }; })
    .catch(function(){ return { cover: url, web: true }; });
}

function parseJsonLoose(text){
  var t = text.trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  var start = t.indexOf('{');
  var end = t.lastIndexOf('}');
  if(start >= 0 && end > start) t = t.slice(start, end+1);
  return JSON.parse(t);
}

/* ---------- persistence ---------- */
function hasCloudStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
function timeout(ms){
  return new Promise(function(resolve){ setTimeout(resolve, ms); });
}
function loadState(){
  var loader;
  if(hasCloudStorage()){
    loader = window.storage.get('app-state', false).then(function(res){
      if(res && res.value) state = JSON.parse(res.value);
      normalizeState();
    }).catch(function(){ /* no saved state yet, or storage unavailable */ });
  } else {
    loader = Promise.resolve().then(function(){
      try{
        var raw = localStorage.getItem('recipe-box-state');
        if(raw) state = JSON.parse(raw);
      }catch(e){ /* localStorage unavailable, start fresh */ }

  }
  return Promise.race([loader, timeout(4000)]).then(function(){

/* skipSync: true when the change came from the cloud itself (or is bookkeeping), so it isn't pushed straight back */
function saveState(skipSync){
  if(hasCloudStorage()){
    Promise.race([
      window.storage.set('app-state', JSON.stringify(state), false).then(function(r){ return !!r; }),
      timeout(4000).then(function(){ return false; })
    ]).catch(function(){ return false; }).then(function(ok){
      ui.saveError = !ok;

    try{

    }catch(e){

}

  }, setSyncError));

    if(doc.metadata.hasPendingWrites) return;

    if(!unknownYet){
      try{ changed = applyRemoteMeta(doc); }catch(e){ setSyncError(e); return; }

function applyRemoteRecipes(snap){
  var meta = state.syncMeta, changed = false, needsPush = false;
  snap.docChanges().forEach(function(change){
    if(change.type === 'removed') return;
    if(change.doc.metadata && change.doc.metadata.hasPendingWrites) return;
    var id = change.doc.id;
    var data = change.doc.data() || {};
    var idx = indexOfRecipe(id);
    var local = idx > -1 ? state.recipes[idx] : null;
    var remoteTs = data.updatedAt || 0;
    var localDirty = !!local && meta.hashes[id] !== recipeHash(local);

    if(data.deleted){
      if(!local){ meta.deleted[id] = Math.max(meta.deleted[id] || 0, remoteTs); return; }
      if(localDirty || (local.updatedAt || 0) > remoteTs){
        /* edited here after it was deleted elsewhere: keep it and push it back up */
        delete meta.hashes[id]; needsPush = true; return;
      }
      state.recipes.splice(idx, 1);
      delete meta.hashes[id];
      meta.deleted[id] = remoteTs;
      if(ui.openRecipeId === id) ui.openRecipeId = null;
      changed = true;
      return;
    }

    if(localDirty){ needsPush = true; return; }                       /* unsent local edits win */
    if(local && (local.updatedAt || 0) >= remoteTs) return;            /* already have this version */
    if(!local && (meta.deleted[id] || 0) >= remoteTs) return;          /* deleted here more recently */
    var rec = data;
    delete rec.deleted;
    rec.id = id;
    if(local) state.recipes[idx] = rec; else state.recipes.push(rec);
    meta.hashes[id] = recipeHash(rec);
    delete meta.deleted[id];
    changed = true;
  });
  if(changed){
    state.recipes.sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
    saveState(true);
  }
  if(needsPush) scheduleSyncPush();
}

/* returns true if local data changed */
function applyRemoteMeta(doc){
  var meta = state.syncMeta;
  if(!doc.exists){ meta.metaSynced = true; return false; }
  var data = doc.data() || {};
  var remoteTs = data.updatedAt || 0;

  if(!meta.metaSynced){
    /* first time this device meets the cloud copy: merge, don't overwrite */
    var names = {};
    state.pantry.forEach(function(p){ names[String(p.name).toLowerCase()] = true; });
    (data.pantry || []).forEach(function(p){
      var key = String(p.name).toLowerCase();
      if(!names[key]){ state.pantry.push(p); names[key] = true; }
    });
    var ids = {};
    state.shopping.forEach(function(s){ ids[s.id] = true; });
    (data.shopping || []).forEach(function(s){ if(!ids[s.id]){ state.shopping.push(s); ids[s.id] = true; } });
    Object.keys(data.settings || {}).forEach(function(k){
      if(k !== 'apiConfig' && k !== 'firebaseConfig') state.settings[k] = data.settings[k];
    });
    meta.metaSynced = true;
    meta.metaHash = null;               /* forces the merged result to be pushed */
    return true;
  }

  if(meta.metaHash !== currentMetaHash()) return false;   /* unsent local changes win */
  if(remoteTs <= (meta.metaUpdatedAt || 0)) return false; /* nothing newer */
  state.pantry = data.pantry || [];
  state.shopping = data.shopping || [];
  Object.keys(data.settings || {}).forEach(function(k){
    if(k !== 'apiConfig' && k !== 'firebaseConfig') state.settings[k] = data.settings[k];
  });
  meta.metaUpdatedAt = remoteTs;
  meta.metaHash = currentMetaHash();
  return true;
}

function scheduleSyncPush(){
  if(!syncIsActive() || !sync.ready) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushChanges, 1200);
}

/* Firestore documents max out at 1 MiB, so trim the oldest "my make" photos if a recipe is too big to sync whole */
function recipeToRemote(r){
  var copy = JSON.parse(JSON.stringify(r));
  copy.deleted = false;
  var LIMIT = 900000;
  while(JSON.stringify(copy).length > LIMIT && copy.makePhotos && copy.makePhotos.length){
    copy.makePhotos.shift(); sync.trimmed = true;
  }
  if(JSON.stringify(copy).length > LIMIT && copy.cover && String(copy.cover).indexOf('data:') === 0){
    copy.cover = null; sync.trimmed = true;
  }
  return copy;
}

function pushChanges(){
  if(!syncIsActive() || !sync.ready) return Promise.resolve();
  if(sync.pushing){ sync.pushAgain = true; return Promise.resolve(); }
  sync.pushing = true;
  var meta = state.syncMeta;
  var now = Date.now();
  var ops = [];
  var currentIds = {};

  state.recipes.forEach(function(r){
    currentIds[r.id] = true;
    var h = recipeHash(r);
    if(meta.hashes[r.id] !== h){
      r.updatedAt = now;
      ops.push({ ref: recipesRef().doc(r.id), data: recipeToRemote(r),
        after: function(){ meta.hashes[r.id] = h; delete meta.deleted[r.id]; } });
    }
  });
  Object.keys(meta.hashes).forEach(function(id){
    if(!currentIds[id]){
      ops.push({ ref: recipesRef().doc(id), data: { deleted: true, updatedAt: now },
        after: function(){ delete meta.hashes[id]; meta.deleted[id] = now; } });
    }
  });
  var mh = currentMetaHash();
  if(meta.metaHash !== mh){
    var payload = metaPayload();
    payload.updatedAt = now;
    ops.push({ ref: metaRef(), data: JSON.parse(JSON.stringify(payload)),
      after: function(){ meta.metaHash = mh; meta.metaUpdatedAt = now; } });
  }

  if(!ops.length){
    sync.pushing = false;
    if(sync.status !== "synced"){ sync.status = "synced"; sync.error = ""; sync.lastSync = Date.now(); render(); }
    return Promise.resolve();
  }

  sync.status = "syncing";
  render();
  var chain = Promise.resolve();
  for(var i = 0; i < ops.length; i += 400){
    (function(chunk){
      chain = chain.then(function(){
        var batch = sync.db.batch();
        chunk.forEach(function(op){ batch.set(op.ref, op.data); });
        return batch.commit().then(function(){ chunk.forEach(function(op){ op.after(); }); });
      });
    })(ops.slice(i, i + 400));
  }
  return chain.then(function(){
    sync.status = "synced"; sync.error = ""; sync.lastSync = Date.now();
  }).catch(function(err){
    sync.status = "error"; sync.error = friendlySyncError(err);
  }).then(function(){
    sync.pushing = false;
    saveState(true);
    if(sync.pushAgain){ sync.pushAgain = false; scheduleSyncPush(); }
  });
}

function attachSyncHandlers(){
  var sd = ensureSyncDraft();
  var emailEl = document.getElementById('sync-email');
  var passEl = document.getElementById('sync-password');
  if(emailEl) emailEl.oninput = function(){ sd.email = emailEl.value; };
  if(passEl) passEl.oninput = function(){ sd.password = passEl.value; };
  var formEl = document.getElementById('sync-form');
  if(formEl) formEl.onsubmit = function(e){ e.preventDefault(); runAuth(sd.mode === 'create' ? 'create' : 'signin'); return false; };
  var modeBtn = document.getElementById('sync-mode-btn');
  if(modeBtn) modeBtn.onclick = function(){
    if(emailEl) sd.email = emailEl.value.trim();
    if(passEl) sd.password = passEl.value;
    sd.mode = sd.mode === 'create' ? 'signin' : 'create'; sd.error = ""; sd.info = ""; render();
  };

  function runAuth(kind){
    if(emailEl) sd.email = emailEl.value.trim();
    if(passEl) sd.password = passEl.value;
    if(!sd.email || !sd.password){ sd.error = "Enter your email and password."; sd.info = ""; render(); return; }
    if(!sync.auth){ sd.error = "Not connected yet — try again in a moment."; render(); return; }
    sd.busy = true; sd.error = ""; sd.info = "";
    render();
    var p = (kind === 'create')
      ? sync.auth.createUserWithEmailAndPassword(sd.email, sd.password)
      : sync.auth.signInWithEmailAndPassword(sd.email, sd.password);
    p.then(function(){ sd.password = ""; sd.mode = "signin"; }).catch(function(err){ sd.error = friendlySyncError(err); }).then(function(){
      sd.busy = false; render();
    });
  }
  var resetBtn = document.getElementById('sync-reset-btn');
  if(resetBtn) resetBtn.onclick = function(){
    if(emailEl) sd.email = emailEl.value.trim();
    if(!sd.email){ sd.error = "Enter your email first, then press Forgot password."; sd.info = ""; render(); return; }
    sd.busy = true; sd.error = ""; sd.info = ""; render();
    sync.auth.sendPasswordResetEmail(sd.email).then(function(){
      sd.info = "Password reset email sent — check your inbox (and spam).";
    }).catch(function(err){ sd.error = friendlySyncError(err); }).then(function(){ sd.busy = false; render(); });
  };

  var nowBtn = document.getElementById('sync-now-btn');
  if(nowBtn) nowBtn.onclick = function(){ pushChanges(); };
  var retryBtn = document.getElementById('sync-retry-btn');
  if(retryBtn) retryBtn.onclick = function(){ initSync(); };
  ['sync-signout-btn'].forEach(function(id){
    var b = document.getElementById(id);
    if(b) b.onclick = function(){ if(sync.auth) sync.auth.signOut().catch(function(err){ setSyncError(err); }); };
  });
}

/* ---------- focus-preserving re-render ---------- */
function withFocusPreserved(fn){
  var ovBefore = document.querySelector('.overlay');
  var ovScroll = ovBefore ? ovBefore.scrollTop : 0, ovKey = ovBefore ? ovBefore.id : null;
  var active = document.activeElement;
  var id = active && active.id;
  var selStart, selEnd;
  if(id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')){
    try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){}
  }
  fn();
  if(ovKey !== null){
    var ovAfter = document.querySelector('.overlay');
    if(ovAfter && ovAfter.id === ovKey) ovAfter.scrollTop = ovScroll;
  }
  if(id){
    var el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart !== undefined){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function render(){
  try{
    withFocusPreserved(function(){
      root.innerHTML = renderApp();
      attachHandlers();
    });
    if(ui.loaded) root.setAttribute('data-ready', '1');
  }catch(err){
    showFatalError(err);
  }
}

function showFatalError(err){
  var msg = (err && err.message) ? err.message : String(err);
  var stack = (err && err.stack) ? err.stack : "";
  root.innerHTML = '<div style="padding:24px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;">' +
    '<strong>Recipe Box hit an error and couldn\'t load.</strong>\n\nPlease send this to Claude so it can be fixed:\n\n' +
    msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') +
    (stack ? ('\n\n' + stack.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')) : '') +
    '</div>';
}

/* ---------- top-level render ---------- */
function renderApp(){
  if(!ui.loaded){
    return '<div style="padding:40px;font-family:monospace;">Opening the recipe box...</div>';
  }
  /* nothing but the sign-in screen until someone is signed in */
  if(!sync.user){
    return renderLoginScreen();
  }
  var html = '';
  html += '<header class="top">';
  html += '<div class="brand"><div class="mark">RB</div><div><h1>Recipe Box</h1><p>your recipes, your way</p></div></div>';
  html += '<div class="top-actions">';
  html += syncChipHtml();
  html += '</div></header>';

  if(ui.saveError){
    html += '<div class="banner">Couldn\'t save to browser storage right now — your changes may not persist. Consider downloading a backup.</div>';
  }

  html += '<nav class="tabs">';
  html += '<button class="tab-btn' + (ui.tab==="recipes"?" active":"") + '" data-tab="recipes">Recipes</button>';
  html += '<button class="tab-btn' + (ui.tab==="pantry"?" active":"") + '" data-tab="pantry">Pantry &amp; Shopping</button>';
  html += '<button class="tab-btn' + (ui.tab==="settings"?" active":"") + '" data-tab="settings">Settings</button>';
  html += '</nav>';

  if(ui.tab === "recipes"){
    var openRecipe = state.recipes.find(function(r){ return r.id === ui.openRecipeId; });
    html += openRecipe ? renderRecipeDetail(openRecipe) : renderRecipeList();
  } else if(ui.tab === "pantry"){
    html += renderPantry();
  } else if(ui.tab === "settings"){
    html += renderSettings();
  }

  html += '<footer class="tip">Everything here lives in your browser and can be downloaded anytime as a backup file.</footer>';

  if(ui.showAdd){
    html += renderAddModal();
  }
  if(ui.coverPick){
    html += renderCoverPickModal();
  }
  if(ui.tidy){
    html += renderTidyModal();
  }
  if(ui.pendingShare && (sync.ready || !syncIsActive())){
    html += renderShareModal();
  }
  return html;
}

    html += '<p style="font-size:13px;color:var(--ink-soft);margin-top:0;">AI tidy-up: ' + r.ingredients.length + ' \u2192 ' + a.ingredients.length + ' ingredients, ' + r.steps.length + ' \u2192 ' + a.steps.length + ' steps. Have a read before you apply it \u2014 nothing changes until you do.</p>';

function getAllTags(){
  var s = {};
  state.recipes.forEach(function(r){ (r.tags||[]).forEach(function(t){ s[t]=true; }); });
  return Object.keys(s);
}
function getFilteredRecipes(){
  var q = ui.search.toLowerCase();
  return state.recipes.filter(function(r){
    var matchesSearch = !q || r.title.toLowerCase().indexOf(q) > -1 ||
      (r.ingredients||[]).some(function(i){ return i.name.toLowerCase().indexOf(q) > -1; });
    var matchesFilters = ui.activeFilters.length === 0 || ui.activeFilters.every(function(f){ return (r.tags||[]).indexOf(f) > -1; });
    return matchesSearch && matchesFilters;
  });
}

  html += '</div>';
  html += '</div>';
  }

    var seenT = {}, chips = [];
    displaySteps.forEach(function(st){ (String(st).match(TIME_RE) || []).forEach(function(tm){ var k = tm.toLowerCase().replace(/\s+/g, ''); if(!seenT[k]){ seenT[k] = 1; chips.push(tm.trim()); } }); });

    html += '<li><span class="step-num">' + (layout==="bullets" ? "" : (i+1)) + '</span><span>' + body + '</span></li>';

  return html;
}

    html += '<button class="btn btn-primary" style="margin-top:10px;" id="extract-url-btn" ' + (d.loading?"disabled":"") + '>' + (d.loading ? "Fetching..." : "Extract recipe") + '</button>';
    if(d.loading) html += '<div class="status-line"><span class="spinner"></span> Reading the page...</div>';
    html += '<p style="font-size:11px;color:var(--ink-soft);margin-top:6px;">For YouTube, this works best when the recipe is written in the video description.</p></div>';
  }

  if(d.error){
    html += '<p class="error-line">' + esc(d.error) + '</p>';
  }

  if(d.mode === "manual"){
    html += '<div>';
    html += '<div class="field-group"><label class="field">Title</label><input type="text" id="title-input" placeholder="Sunday roast chicken" value="' + esc(d.title) + '"></div>';
    html += '<div class="field-group" style="display:flex;gap:10px;"><div style="flex:1;"><label class="field">Time</label><input type="text" id="time-input" placeholder="e.g. 45 min" maxlength="40" value="' + esc(d.time || '') + '"></div><div style="flex:1;"><label class="field">Portions</label><input type="text" id="servings-input" placeholder="e.g. 4" maxlength="40" value="' + esc(d.servings || '') + '"></div></div>';
    html += '<div class="field-group"><label class="field">Cover photo</label>';
    if(d.cover) html += '<img src="' + d.cover + '" style="width:80px;height:80px;object-fit:cover;border-radius:5px;margin-bottom:8px;display:block;">';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
    html += '<label class="btn btn-ghost btn-sm" style="cursor:pointer;">Choose photo<input type="file" accept="image/*" id="cover-input" style="display:none;"></label>';
    html += '<button class="btn btn-ghost btn-sm" id="auto-cover-btn" ' + (d.coverLoading?"disabled":"") + '>' + (d.coverLoading ? "Searching..." : ((d.coverCands && d.coverCands.length > 1 && d.coverCandsFor === d.title.trim()) ? "Try another photo" : "Find a photo for me")) + '</button>';
    html += '</div>';
    if(d.coverLoading) html += '<div class="status-line"><span class="spinner"></span> Looking for a cover photo...</div>';
    html += '</div>';

    html += '<div class="field-group"><label class="field">Ingredients</label>';
    d.ingredients.forEach(function(ing, i){
      html += '<div class="grid3" style="margin-bottom:6px;">';
      html += '<input type="text" placeholder="ingredient" id="ing-name-' + i + '" data-ing-field="name" data-ing-idx="' + i + '" value="' + esc(ing.name) + '">';
      html += '<input type="text" placeholder="amount" id="ing-amount-' + i + '" data-ing-field="amount" data-ing-idx="' + i + '" value="' + esc(ing.amount) + '">';
      html += '<div style="display:flex;gap:4px;"><input type="text" placeholder="unit" id="ing-unit-' + i + '" data-ing-field="unit" data-ing-idx="' + i + '" value="' + esc(ing.unit) + '">';
      html += '<button class="small-x" data-remove-ing="' + i + '">&times;</button></div></div>';
    });
    html += '<button class="btn btn-ghost btn-sm" id="add-ing-row">+ ingredient</button></div>';

    html += '<div class="field-group"><label class="field">Method</label>';
    d.steps.forEach(function(s, i){
      html += '<div class="step-row" data-step-row="' + i + '">';
      if(d.steps.length > 1){
        html += '<div class="reorder"><span class="drag-h" data-drag-step="' + i + '" title="Drag to reorder" aria-hidden="true">\u283f</span>';
        html += '<div class="mv-col"><button type="button" class="mv" id="step-up-' + i + '" data-move-step="' + i + '" data-dir="-1" title="Move step ' + (i+1) + ' up" aria-label="Move step ' + (i+1) + ' up" ' + (i === 0 ? 'disabled' : '') + '>\u25b2</button>';
        html += '<button type="button" class="mv" id="step-down-' + i + '" data-move-step="' + i + '" data-dir="1" title="Move step ' + (i+1) + ' down" aria-label="Move step ' + (i+1) + ' down" ' + (i === d.steps.length - 1 ? 'disabled' : '') + '>\u25bc</button></div></div>';
      }
      html += '<textarea rows="2" id="step-' + i + '" data-step-idx="' + i + '" placeholder="Step ' + (i+1) + '">' + esc(s) + '</textarea>';
      html += '<button class="small-x" data-remove-step="' + i + '">&times;</button></div>';
    });
    html += '<button class="btn btn-ghost btn-sm" id="add-step-row">+ step</button></div>';

    html += '<div class="field-group"><label class="field">Tags</label><div class="chip-row">';
    ALL_TAGS.forEach(function(t){
      html += '<button type="button" class="chip draft-tag' + (d.tags.indexOf(t)>-1?" active":"") + '" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
    });
    html += '</div></div>';

    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-primary" id="save-recipe-btn">' + (ui.editingRecipeId ? 'Save changes' : 'Save recipe') + '</button>';
    html += '<button class="btn btn-ghost" id="tidy-draft-btn" type="button">Tidy up</button></div>';
    if(ui.editingRecipeId){
      var er = state.recipes.filter(function(x){ return x.id === ui.editingRecipeId; })[0];
      html += '<div class="more-opts"><h4>More options</h4>';
      html += '<p style="font-size:12px;color:var(--ink-soft);margin:0 0 10px;">Tidy up and the version switch save your edits first.</p>';
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">';
      html += '<button class="btn btn-ghost btn-sm" id="edit-tidy-open-btn" type="button">Tidy up with preview\u2026</button>';
      if(er && er.original){
        var viewingO = ui.viewOriginalId === er.id;
        html += '<div class="seg" role="group" aria-label="Version to show"><button type="button" id="ver-current-btn" class="' + (viewingO ? '' : 'on') + '">Current</button><button type="button" id="ver-original-btn" class="' + (viewingO ? 'on' : '') + '">Original</button></div>';
      }
      html += '</div>';
      html += '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">';
      if(ui.confirmDeleteId === ui.editingRecipeId){
        html += '<span style="font-size:12px;">Delete for good?</span><button class="btn btn-danger btn-sm" id="edit-confirm-delete" type="button">Yes, delete</button><button class="btn btn-ghost btn-sm" id="edit-cancel-delete" type="button">Cancel</button>';
      } else {
        html += '<button class="btn btn-danger btn-sm" id="edit-ask-delete" type="button">Delete recipe</button>';
      }
      html += '</div></div>';
    }
    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

/* ---------- reading form values back from DOM (uncontrolled inputs) ---------- */
function syncDraftFromDom(){
  var d = ui.draft;
  var titleEl = document.getElementById('title-input');
  if(titleEl) d.title = titleEl.value;
  var timeEl = document.getElementById('time-input'); if(timeEl) d.time = timeEl.value;
  var servEl = document.getElementById('servings-input'); if(servEl) d.servings = servEl.value;
  var urlEl = document.getElementById('url-input');
  if(urlEl) d.url = urlEl.value;
  var textEl = document.getElementById('text-input');
  if(textEl) d.pasteText = textEl.value;
  d.ingredients.forEach(function(ing, i){
    var n = document.getElementById('ing-name-'+i), a = document.getElementById('ing-amount-'+i), u = document.getElementById('ing-unit-'+i);
    if(n) ing.name = n.value;
    if(a) ing.amount = a.value;
    if(u) ing.unit = u.value;
  });
  d.steps.forEach(function(s, i){
    var el = document.getElementById('step-'+i);
    if(el) d.steps[i] = el.value;
  });
}

/* ---------- event wiring ---------- */
function attachHandlers(){
  if(ui.loaded && !sync.user){ attachSyncHandlers(); return; }
  var settingsExportBtn = document.getElementById('settings-export-btn');
  if(settingsExportBtn) settingsExportBtn.onclick = exportBackup;
  var importInput = document.getElementById('import-input');
  if(importInput) importInput.onchange = importBackup;
  var syncChipBtn = document.getElementById('sync-chip-btn');
  if(syncChipBtn) syncChipBtn.onclick = function(){ ui.tab = "settings"; ui.openRecipeId = null; render(); };

  var tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(function(btn){
    btn.onclick = function(){ ui.tab = btn.getAttribute('data-tab'); ui.openRecipeId = null; render(); };
  });

  if(ui.tab === "recipes"){
    var openRecipe = state.recipes.find(function(r){ return r.id === ui.openRecipeId; });
    if(!openRecipe){
      attachRecipeListHandlers();
    } else {
      attachRecipeDetailHandlers(openRecipe);
    }
  } else if(ui.tab === "pantry"){
    attachPantryHandlers();
  } else if(ui.tab === "settings"){
    attachSettingsHandlers();
  }

  if(ui.showAdd){
    attachModalHandlers();
  }
  attachOverlayHandlers();
}

/* tidy-up preview and incoming-share prompt: shown over any tab, so wired up regardless of which tab is open */
function attachOverlayHandlers(){
  var coverOverlay = document.getElementById('cover-overlay');
  if(coverOverlay) coverOverlay.onclick = function(e){ if(e.target === coverOverlay && ui.coverPick && !ui.coverPick.saving){ ui.coverPick = null; render(); } };
  var coverCancel = document.getElementById('cover-cancel-btn');
  if(coverCancel) coverCancel.onclick = function(){ ui.coverPick = null; render(); };
  var coverNext = document.getElementById('cover-next-btn');
  if(coverNext) coverNext.onclick = function(){ ui.coverPick.idx = (ui.coverPick.idx + 1) % ui.coverPick.cands.length; render(); };
  var coverUse = document.getElementById('cover-use-btn');
  if(coverUse) coverUse.onclick = function(){
    var c = ui.coverPick;
    var rr = state.recipes.filter(function(x){ return x.id === c.recipeId; })[0];
    if(!rr){ ui.coverPick = null; render(); return; }
    c.saving = true; render();
    toLocalCover(c.cands[c.idx]).then(function(res){
      rr.cover = res.cover; rr.coverIsWebLink = res.web;
      ui.coverPick = null;
      saveState();
    });
  };
  var tidyOverlay = document.getElementById('tidy-overlay');
  if(tidyOverlay) tidyOverlay.onclick = function(e){ if(e.target === tidyOverlay && ui.tidy && !ui.tidy.loading){ ui.tidy = null; render(); } };
  var tidyCancel = document.getElementById('tidy-cancel-btn');
  if(tidyCancel) tidyCancel.onclick = function(){ ui.tidy = null; render(); };
  var tidyApply = document.getElementById('tidy-apply-btn');
  if(tidyApply) tidyApply.onclick = function(){
    var t = ui.tidy;
    var rr = state.recipes.filter(function(x){ return x.id === t.recipeId; })[0];
    if(rr){
      var madeSnap = snapshotOriginal(rr), beforeCore = coreOf(rr);
      rr.title = t.after.title || rr.title;
      rr.ingredients = t.after.ingredients;
      rr.steps = t.after.steps;
      if(t.after.tags) rr.tags = t.after.tags;
      rr.stepsQuick = null; rr.stepsGuided = null;
      dropOriginalIfUnchanged(rr, madeSnap, beforeCore);
    }
    ui.tidy = null; ui.detailLevelOverride = null;
    saveState();
  };
  var tidyLocal = document.getElementById('tidy-local-btn');
  if(tidyLocal) tidyLocal.onclick = function(){
    var rr = state.recipes.filter(function(x){ return x.id === ui.tidy.recipeId; })[0];
    var res = tidyRecipeLocal(rr);
    ui.tidy = { recipeId: rr.id, source: "local", after: res, changes: res.changes, loading: false, error: "" };
    render();
  };
  var tidyAi = document.getElementById('tidy-ai-btn');
  if(tidyAi) tidyAi.onclick = function(){
    var rid = ui.tidy.recipeId;
    var rr = state.recipes.filter(function(x){ return x.id === rid; })[0];
    ui.tidy = { recipeId: rid, source: "ai", after: null, changes: [], loading: true, error: "" };
    render();
    generateTidyAI(rr).then(function(after){
      if(!ui.tidy || ui.tidy.recipeId !== rid) return;
      ui.tidy = { recipeId: rid, source: "ai", after: after, changes: [], loading: false, error: "" };
      render();
    }).catch(function(err){
      var res = tidyRecipeLocal(rr);
      ui.tidy = { recipeId: rid, source: "local", after: res, changes: res.changes, loading: false, error: friendlyErrorMessage(err, "Couldn't reach the AI \u2014 showing the simple tidy-up instead.") };
      render();
    });
  };

  var shareAccept = document.getElementById('share-accept-btn');
  if(shareAccept) shareAccept.onclick = function(){
    var g = ui.pendingShare.recipe;
    var res = addImportedRecipes([g]);
    clearPendingShare();
    saveState();
    if(!res.added) alert('You already have \u201c' + g.title + '\u201d in your recipes.');
    else { ui.tab = "recipes"; ui.openRecipeId = null; render(); }
  };
  var shareReview = document.getElementById('share-review-btn');
  if(shareReview) shareReview.onclick = function(){
    var g = ui.pendingShare.recipe;
    clearPendingShare();
    ui.draft = freshDraft(); ui.editingRecipeId = null; ui.showAdd = true; ui.tab = "recipes"; ui.openRecipeId = null;
    loadRecipeIntoForm(g); ui.draft.error = "Shared with you \u2014 edit anything you like, then save.";
    render();
  };
  var shareDismiss = document.getElementById('share-dismiss-btn');
  if(shareDismiss) shareDismiss.onclick = function(){ clearPendingShare(); render(); };
}

function attachRecipeListHandlers(){
  var searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.oninput = function(){ ui.search = searchInput.value; render(); };
  }
  var addBtn = document.getElementById('add-recipe-btn');
  if(addBtn) addBtn.onclick = function(){ ui.draft = freshDraft(); ui.editingRecipeId = null; ui.showAdd = true; render(); };

  document.querySelectorAll('.filter-chip').forEach(function(chip){
    chip.onclick = function(){
      var t = chip.getAttribute('data-tag');
      var idx = ui.activeFilters.indexOf(t);
      if(idx>-1) ui.activeFilters.splice(idx,1); else ui.activeFilters.push(t);
      render();
    };
  });

  document.querySelectorAll('[data-open]').forEach(function(card){
    card.onclick = function(){
      ui.openRecipeId = card.getAttribute('data-open');
      ui.detailQuantitiesOverride = null;
      ui.detailLevelOverride = null;
      ui.detailNote = "";
      ui.shareMenu = false;
      ui.confirmDeleteId = null; ui.viewOriginalId = null;
      render();
    };
  });
}

function attachRecipeDetailHandlers(r){
  var backBtn = document.getElementById('back-to-list');
  if(backBtn) backBtn.onclick = function(){ ui.openRecipeId = null; render(); };

  var addShopBtn = document.getElementById('add-to-shopping');
  if(addShopBtn) addShopBtn.onclick = function(){
    var items = (r.ingredients||[]).map(function(i){ return (i.amount + " " + i.unit + " " + i.name).trim(); });
    items.forEach(function(name){ state.shopping.push({id:uid(), name:name, checked:false}); });
    saveState();
  };

  var makePhotoInput = document.getElementById('make-photo-input');
  if(makePhotoInput){
    makePhotoInput.onchange = function(e){
      var file = e.target.files[0];
      if(!file) return;
      resizeImage(file, 700, 0.7).then(function(dataUrl){
        r.makePhotos = (r.makePhotos||[]).concat([dataUrl]);
        saveState();
      });
    };
  }

  var toggleQtyBtn = document.getElementById('toggle-quantities');
  if(toggleQtyBtn) toggleQtyBtn.onclick = function(){
    var current = ui.detailQuantitiesOverride !== null ? ui.detailQuantitiesOverride : state.settings.showQuantities;
    ui.detailQuantitiesOverride = !current;
    render();
  };

  document.querySelectorAll('[data-level]').forEach(function(b){
    b.onclick = function(){ setMethodLevel(r, b.getAttribute('data-level')); };
  });
  var regenBtn = document.getElementById('regen-level-btn');
  if(regenBtn) regenBtn.onclick = function(){
    var lv = ui.detailLevelOverride || state.settings.detailLevel;
    if(lv === "quick") r.stepsQuick = null; else if(lv === "guided") r.stepsGuided = null; else return;
    setMethodLevel(r, lv);
  };
  var showCur = document.getElementById('show-current-btn');
  if(showCur) showCur.onclick = function(){ ui.viewOriginalId = null; render(); };
  var editBtn = document.getElementById('edit-recipe-btn');
  if(editBtn) editBtn.onclick = function(){ openEditModal(r); };

  warmShareLink(r);
  var shareMenuBtn = document.getElementById('share-menu-btn');
  if(shareMenuBtn) shareMenuBtn.onclick = function(e){
    e.stopPropagation(); ui.shareMenu = !ui.shareMenu;
    if(ui.shareMenu) warmShortLink(r);   /* made while the menu is open so the tap can use it instantly */
    render();
  };
  function menuAction(id, fn){
    var el = document.getElementById(id);
    if(el) el.onclick = function(){ ui.shareMenu = false; fn(); render(); };
  }
  menuAction('share-whatsapp-btn', function(){ shareOnWhatsApp(r); });
  menuAction('share-link-btn', function(){ copyShareLink(r); });
  menuAction('share-copy-btn', function(){ copyRecipeAsText(r); });
  menuAction('share-print-btn', function(){ setTimeout(function(){ try{ window.print(); }catch(e){ alert("Couldn't open the print dialog from here \u2014 try your browser's own Print option."); } }, 60); });
  menuAction('share-download-btn', function(){ exportSingleRecipe(r); });
  menuAction('share-native-btn', function(){
    if(shareNeedsHosting()) return;
    navigator.share({ title: r.title, text: '\u201c' + r.title + '\u201d \u2014 open this link to add it to your Recipe Box:', url: getShareLink(r) }).catch(function(){});
  });
  var findCoverBtn = document.getElementById('find-cover-btn');
  if(findCoverBtn) findCoverBtn.onclick = function(){
    ui.coverPick = { recipeId: r.id, cands: [], idx: 0, loading: true, saving: false };
    render();
    findCoverCandidates(r).then(function(list){
      if(!ui.coverPick || ui.coverPick.recipeId !== r.id) return;
      ui.coverPick.cands = list; ui.coverPick.idx = 0; ui.coverPick.loading = false;
      render();
    });
  };

}

function attachPantryHandlers(){
  document.querySelectorAll('[data-shop-toggle]').forEach(function(cb){
    cb.onchange = function(){
      var id = cb.getAttribute('data-shop-toggle');
      var item = state.shopping.find(function(i){ return i.id === id; });
      if(item) item.checked = !item.checked;
      saveState();
    };
  });
  document.querySelectorAll('[data-shop-remove]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-shop-remove');
      state.shopping = state.shopping.filter(function(i){ return i.id !== id; });
      saveState();
    };
  });
  function moveToPantry(ids){
    var have = {};
    state.pantry.forEach(function(p){ have[p.name.trim().toLowerCase()] = true; });
    state.shopping.forEach(function(i){
      if(ids.indexOf(i.id) === -1) return;
      var k = i.name.trim().toLowerCase();
      if(k && !have[k]){ state.pantry.push({ id: uid(), name: i.name.trim() }); have[k] = true; }
    });
    state.shopping = state.shopping.filter(function(i){ return ids.indexOf(i.id) === -1; });
    saveState();
  }
  document.querySelectorAll('[data-shop-to-pantry]').forEach(function(btn){
    btn.onclick = function(){ moveToPantry([btn.getAttribute('data-shop-to-pantry')]); };
  });
  var tickedBtn = document.getElementById('shop-ticked-to-pantry');
  if(tickedBtn) tickedBtn.onclick = function(){
    moveToPantry(state.shopping.filter(function(i){ return i.checked; }).map(function(i){ return i.id; }));
  };
  document.querySelectorAll('[data-pantry-remove]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-pantry-remove');
      state.pantry = state.pantry.filter(function(i){ return i.id !== id; });
      saveState();
    };
  });
  var shopAddBtn = document.getElementById('shop-add-btn');
  var shopInput = document.getElementById('shop-input');
  function addShop(){
    if(shopInput && shopInput.value.trim()){
      state.shopping.push({id:uid(), name:shopInput.value.trim(), checked:false});
      saveState();
    }
  }
  if(shopAddBtn) shopAddBtn.onclick = addShop;
  if(shopInput) shopInput.onkeydown = function(e){ if(e.key==='Enter') addShop(); };

  var pantryAddBtn = document.getElementById('pantry-add-btn');
  var pantryInput = document.getElementById('pantry-input');
  function addPantry(){
    if(pantryInput && pantryInput.value.trim()){
      state.pantry.push({id:uid(), name:pantryInput.value.trim()});
      saveState();
    }
  }
  if(pantryAddBtn) pantryAddBtn.onclick = addPantry;
  if(pantryInput) pantryInput.onkeydown = function(e){ if(e.key==='Enter') addPantry(); };
}

function attachSettingsHandlers(){
  document.querySelectorAll('[data-set-units]').forEach(function(btn){
    btn.onclick = function(){ state.settings.units = btn.getAttribute('data-set-units'); saveState(); };
  });
  document.querySelectorAll('[data-set-layout]').forEach(function(btn){
    btn.onclick = function(){ state.settings.layout = btn.getAttribute('data-set-layout'); saveState(); };
  });
  document.querySelectorAll('[data-set-qty]').forEach(function(btn){
    btn.onclick = function(){ state.settings.showQuantities = btn.getAttribute('data-set-qty') === 'on'; saveState(); };
  });
  document.querySelectorAll('[data-set-detail]').forEach(function(btn){
    btn.onclick = function(){ state.settings.detailLevel = btn.getAttribute('data-set-detail'); saveState(); };
  });

  if(!ui.apiDraft){
    var cfg = state.settings.apiConfig || { enabled:false, provider:"anthropic", apiKey:"", model:"" };
    ui.apiDraft = { enabled: !!cfg.enabled, provider: cfg.provider || "anthropic", apiKey: cfg.apiKey || "", model: cfg.model || "" };
  }
  var ad = ui.apiDraft;

  function syncApiDraftFromDom(){
    var keyEl = document.getElementById('api-key-input');
    var modelEl = document.getElementById('api-model-input');
    if(keyEl) ad.apiKey = keyEl.value;
    if(modelEl) ad.model = modelEl.value;
  }

  document.querySelectorAll('[data-api-enabled]').forEach(function(btn){
    btn.onclick = function(){
      syncApiDraftFromDom();
      ad.enabled = btn.getAttribute('data-api-enabled') === 'on';
      if(!ad.enabled){
        /* "Off" takes effect straight away (the key stays saved so turning it back on is easy) */
        state.settings.apiConfig = Object.assign({ provider: "anthropic", apiKey: "", model: "" }, state.settings.apiConfig, { enabled: false });
        saveState();
      } else render();
    };
  });
  document.querySelectorAll('[data-api-provider]').forEach(function(btn){
    btn.onclick = function(){ syncApiDraftFromDom(); ad.provider = btn.getAttribute('data-api-provider'); render(); };
  });
  var saveApiBtn = document.getElementById('save-api-settings-btn');
  if(saveApiBtn) saveApiBtn.onclick = function(){
    syncApiDraftFromDom();
    state.settings.apiConfig = { enabled: ad.enabled, provider: ad.provider, apiKey: ad.apiKey.trim(), model: ad.model.trim() };
    saveState();
  };
  var clearApiBtn = document.getElementById('clear-api-settings-btn');
  if(clearApiBtn) clearApiBtn.onclick = function(){
    ui.apiDraft = { enabled: false, provider: "anthropic", apiKey: "", model: "" };
    state.settings.apiConfig = { enabled: false, provider: "anthropic", apiKey: "", model: "" };
    saveState();
  };

  attachSyncHandlers();
}

function attachModalHandlers(){
  var overlay = document.getElementById('modal-overlay');
  if(overlay) overlay.onclick = function(e){ if(e.target === overlay){ ui.showAdd = false; ui.editingRecipeId = null; render(); } };
  var closeBtn = document.getElementById('modal-close-btn');
  if(closeBtn) closeBtn.onclick = function(){ ui.showAdd = false; ui.editingRecipeId = null; render(); };

  document.querySelectorAll('.add-mode-tabs [data-mode]').forEach(function(btn){
    btn.onclick = function(){ syncDraftFromDom(); ui.draft.mode = btn.getAttribute('data-mode'); ui.draft.error=""; render(); };
  });

          d.coverIdx = (d.coverIdx + 1) % d.coverCands.length;

          render(); return;
        }
        d.coverLoading = true; d.error = "";
        render();
        findCoverCandidates({ title: title, originalUrl: d.url }).then(function(list){

    document.querySelectorAll('[data-remove-ing]').forEach(function(btn){

    document.querySelectorAll('[data-step-idx]').forEach(function(el){

      };
    });
    document.querySelectorAll('[data-remove-step]').forEach(function(btn){
      btn.onclick = function(){
        syncDraftFromDom();
