<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recipe Box</title>
<style>
  :root{
    --paper:#EDE4D3;
    --card:#FBF8F1;
    --ink:#2E2115;
    --ink-soft:#5C4E3D;
    --basil:#4A6741;
    --basil-dark:#374d30;
    --mustard:#D9A441;
    --brick:#B84A3E;
    --line:#D9CBAE;
    --shadow: 0 2px 0 rgba(46,33,21,0.08), 0 8px 20px -12px rgba(46,33,21,0.35);
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --font-serif: ui-serif, Georgia, "Times New Roman", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-sans);
    background-image: radial-gradient(circle at 1px 1px, rgba(46,33,21,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .app{max-width:1000px;margin:0 auto;padding:24px 20px 80px;}

  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:44px;height:44px;border-radius:6px;background:var(--basil);
    display:flex;align-items:center;justify-content:center;color:var(--card);
    font-family:var(--font-mono);font-weight:700;font-size:18px;
    box-shadow:var(--shadow);transform:rotate(-3deg);
  }
  .brand h1{font-family:var(--font-mono);font-size:22px;margin:0;letter-spacing:-0.5px;}
  .brand p{margin:0;font-size:12px;color:var(--ink-soft);}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;}

  nav.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:2px solid var(--line);}
  nav.tabs button{
    font-family:var(--font-mono);font-size:13px;padding:10px 16px;
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    border-bottom:3px solid transparent;margin-bottom:-2px;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--brick);font-weight:700;}

  button{font-family:var(--font-sans);}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;border-radius:5px;border:1.5px solid var(--ink);
    background:var(--card);color:var(--ink);font-size:13px;font-weight:600;
    cursor:pointer;
  }
  .btn:hover{filter:brightness(0.97);}
  .btn-primary{background:var(--basil);border-color:var(--basil-dark);color:#fff;}
  .btn-accent{background:var(--mustard);border-color:#a97c26;color:var(--ink);}
  .btn-danger{background:var(--brick);border-color:#7c2f26;color:#fff;}
  .btn-ghost{background:transparent;border-color:var(--line);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  input[type=text],input[type=number],input[type=url],input[type=password],textarea,select{
    font-family:var(--font-sans);font-size:13px;padding:8px 10px;
    border:1.5px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);width:100%;
  }
  textarea{resize:vertical;}
  label.field{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);margin-bottom:4px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .toolbar input[type=text]{max-width:240px;}
  .chip{
    font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:14px;
    border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink-soft);
  }
  .chip.active{background:var(--ink);color:var(--card);border-color:var(--ink);}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .rcard{
    background:var(--card);border-radius:8px;box-shadow:var(--shadow);cursor:pointer;
    overflow:hidden;position:relative;border:1px solid var(--line);
  }
  .rcard .cover{height:130px;background:var(--basil);background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-mono);font-size:12px;text-align:center;padding:8px;}
  .rcard .body{padding:12px 14px 14px;}
  .rcard h3{font-family:var(--font-serif);font-size:17px;margin:0 0 6px;line-height:1.25;}
  .rcard .meta{font-size:11px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;}
  .tagpill{
    font-size:9.5px;font-family:var(--font-mono);text-transform:uppercase;
    padding:2px 6px;border-radius:3px;background:var(--mustard);color:var(--ink);
  }
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty h3{font-family:var(--font-serif);font-size:20px;color:var(--ink);margin-bottom:6px;}

  .detail-header{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:20px;}
  .detail-cover{width:260px;height:180px;border-radius:8px;background:var(--basil);background-size:cover;background-position:center;box-shadow:var(--shadow);flex-shrink:0;}
  .detail-info{flex:1;min-width:200px;}
  .detail-info h2{font-family:var(--font-serif);font-size:30px;margin:0 0 8px;}
  .back-link{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;margin-bottom:14px;padding:0;font-family:var(--font-mono);}
  .back-link:hover{color:var(--ink);}

  .card-block{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px;}
  .card-block h4{font-family:var(--font-mono);font-size:13px;text-transform:uppercase;letter-spacing:0.5px;margin:0 0 12px;color:var(--basil-dark);}
  .ing-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px;}
  .ing-row:last-child{border-bottom:none;}
  .steps-list{margin:0;padding-left:0;list-style:none;}
  .steps-list li{display:flex;gap:12px;margin-bottom:14px;font-size:14px;line-height:1.5;}
  .step-num{font-family:var(--font-mono);font-weight:700;color:var(--mustard);background:var(--ink);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
  .steps-list.bullets li{align-items:center;}
  .steps-list.bullets .step-num{background:none;color:var(--ink);}
  .steps-list.bullets .step-num::before{content:'\2022';font-size:20px;}

  .photo-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .photo-strip img{width:80px;height:80px;object-fit:cover;border-radius:5px;border:1px solid var(--line);}

  .overlay{position:fixed;inset:0;background:rgba(46,33,21,0.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--card);border-radius:10px;max-width:640px;width:100%;padding:26px 26px 22px;box-shadow:var(--shadow);}
  .modal h3{font-family:var(--font-serif);font-size:22px;margin:0 0 16px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
  .grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;}
  .field-group{margin-bottom:14px;}
  .list-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
  .add-mode-tabs{display:flex;gap:6px;margin-bottom:16px;}
  .add-mode-tabs button{flex:1;}

  .dropzone{
    border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;
    cursor:pointer;color:var(--ink-soft);font-size:13px;display:block;
  }
  .dropzone:hover{border-color:var(--basil);}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:5px;}

  .status-line{font-size:12px;color:var(--ink-soft);margin-top:8px;display:flex;align-items:center;gap:6px;}
  .spinner{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--basil);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-line{color:var(--brick);font-size:12px;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media(max-width:720px){.two-col{grid-template-columns:1fr;} .grid3{grid-template-columns:1fr;}}
  .list-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .list-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--basil);}
  .list-item.checked{color:var(--ink-soft);text-decoration:line-through;}
  .pantry-tag{margin-left:auto;font-size:10px;color:var(--ink-soft);font-family:var(--font-mono);flex-shrink:0;}
  .small-x{background:none;border:none;color:var(--brick);cursor:pointer;font-size:15px;padding:0 4px;}

  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:26px;max-width:380px;width:100%;}
  .login-title{font-family:var(--font-serif);font-size:22px;margin:0 0 14px;}
  .sync-chip{font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink-soft);}
  .sync-chip.ok{border-color:var(--basil);color:var(--basil-dark);}
  .sync-chip.err{border-color:var(--brick);color:var(--brick);}
  .sync-chip.busy{border-style:dashed;}
  pre.rules{background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:10px;font-size:11px;overflow-x:auto;-webkit-user-select:all;user-select:all;margin:6px 0 12px;font-family:var(--font-mono);}
  details.setup summary{cursor:pointer;font-weight:600;font-size:13px;margin-bottom:8px;}
  details.setup ol{font-size:13px;line-height:1.55;padding-left:20px;margin:6px 0 10px;}
  .notice{font-size:12px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin:8px 0;}
  .notice.err{border-color:var(--brick);color:var(--brick);}
  .banner{background:#f7dbd7;border:1px solid var(--brick);padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:14px;}
  footer.tip{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:40px;}
</style>
</head>
<body>
<div id="root" class="app">
  <div style="padding:40px;font-family:monospace;">Opening the recipe box...</div>
</div>

<script>
window.addEventListener('error', function(e){
  var root = document.getElementById('root');
  if(!root || root.getAttribute('data-showing-error') || root.getAttribute('data-ready')) return;
  root.setAttribute('data-showing-error', '1');
  var msg = (e && e.message) ? e.message : 'Unknown error';
  var detail = (e && e.filename) ? (msg + '\n(' + e.filename + ':' + e.lineno + ':' + e.colno + ')') : msg;
  root.innerHTML = '<div style="padding:24px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;">' +
    '<strong>Recipe Box hit an error and couldn\'t load.</strong>\n\nPlease send this to Claude so it can be fixed:\n\n' +
    String(detail).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>';
});
window.addEventListener('unhandledrejection', function(e){
  var root = document.getElementById('root');
  if(!root || root.getAttribute('data-showing-error') || root.getAttribute('data-ready')) return;
  root.setAttribute('data-showing-error', '1');
  var reason = e && e.reason;
  var msg = (reason && reason.message) ? reason.message : String(reason);
  root.innerHTML = '<div style="padding:24px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;">' +
    '<strong>Recipe Box hit an error and couldn\'t load.</strong>\n\nPlease send this to Claude so it can be fixed:\n\n' +
    String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>';
});
</script>

<script>
(function(){
"use strict";

var DIET_TAGS = ["Vegetarian","Vegan","Gluten-free","Dairy-free","Nut-free","Low-carb"];
var CATEGORY_TAGS = ["Breakfast","Main","Side","Dessert","Baking","Drink","Sauce/Base"];
var PANTRY_STAPLES = ["Salt","Black pepper","Olive oil","Flour","Sugar","Butter","Garlic","Onion","Rice","Pasta","Eggs","Milk"];
var ALL_TAGS = CATEGORY_TAGS.concat(DIET_TAGS);

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(str){
  if(str === undefined || str === null) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

var state = {
  recipes: [],
  pantry: PANTRY_STAPLES.map(function(name){ return {id:uid(), name:name}; }),
  shopping: [],
  settings: { units: "metric", layout: "detailed", showQuantities: false, detailLevel: "detailed",
    apiConfig: { enabled: false, provider: "anthropic", apiKey: "", model: "" },
    firebaseConfig: null },
  syncMeta: { uid: null, hashes: {}, deleted: {}, metaHash: null, metaUpdatedAt: 0, metaSynced: false }
};

var ui = {
  loaded: false,
  tab: "recipes",
  openRecipeId: null,
  showAdd: false,
  search: "",
  activeFilters: [],
  saveError: false,
  detailLayoutOverride: null,
  detailQuantitiesOverride: null,
  detailLevelOverride: null,
  summarizeLoadingId: null,
  confirmDeleteId: null,
  editingRecipeId: null,
  apiDraft: null,
  syncDraft: null,
  draft: freshDraft()
};

function freshDraft(){
  return {
    mode: "manual",
    title: "", cover: null,
    ingredients: [{name:"",amount:"",unit:""}],
    steps: [""],
    tags: [],
    url: "",
    photoPreviews: [],
    photoFiles: [],
    loading: false,
    coverLoading: false,
    coverIsWebLink: false,
    useLocalExtraction: getActiveProvider().mode === "none",
    error: ""
  };
}

function openEditModal(r){
  ui.draft = {
    mode: "manual",
    title: r.title || "",
    cover: r.cover || null,
    coverIsWebLink: !!r.coverIsWebLink,
    ingredients: (r.ingredients||[]).map(function(i){ return {name:i.name||"", amount:i.amount||"", unit:i.unit||""}; }),
    steps: (r.steps||[]).slice(),
    tags: (r.tags||[]).slice(),
    url: r.originalUrl || "",
    photoPreviews: [],
    photoFiles: [],
    loading: false,
    coverLoading: false,
    useLocalExtraction: getActiveProvider().mode === "none",
    error: ""
  };
  if(ui.draft.ingredients.length === 0) ui.draft.ingredients = [{name:"",amount:"",unit:""}];
  if(ui.draft.steps.length === 0) ui.draft.steps = [""];
  ui.editingRecipeId = r.id;
  ui.showAdd = true;
  render();
}

var root = document.getElementById('root');

function resizeImage(file, maxW, quality){
  maxW = maxW || 900; quality = quality || 0.75;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- local, no-AI extraction helpers ---------- */

var tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js';
    s.onload = function(){ resolve(); };
    s.onerror = function(){ tesseractLoadPromise = null; reject(new Error("Couldn't load the text-recognition library \u2014 check your connection.")); };
    document.head.appendChild(s);
  });
  return tesseractLoadPromise;
}

function fetchRawHtml(url){
  var attempts = [
    function(){ return fetch(url, { mode: "cors" }); },
    function(){ return fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url)); }
  ];
  function tryAttempt(i){
    if(i >= attempts.length) return Promise.reject(new Error("RAW_FETCH_FAILED"));
    return attempts[i]().then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }).catch(function(){ return tryAttempt(i+1); });
  }
  return tryAttempt(0);
}

function fetchReadableText(url){
  return fetch("https://r.jina.ai/" + url).then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.text();
  });
}

function stripHtmlTags(html){
  var text = html.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ');
  text = text.replace(/<[^>]+>/g, '\n');
  text = text.replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  return text.replace(/\n\s*\n+/g, '\n').trim();
}

/* strips markdown syntax (links, images, headers, rules, tables) down to plain text, for cleaning up Jina reader output */
function cleanMarkdownLine(line){
  return line
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^#+\s*/, '')
    .replace(/^[-*_]{3,}$/, '')
    .replace(/^[>|]+\s*/, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .trim();
}

var NOISE_LINE_RE = /^(advertisement|subscribe|sign up|newsletter|follow us|print(\s+recipe)?|save(\s+recipe)?|share(\s+(this|on))?|jump to recipe|jump to video|rate this recipe|leave a (comment|reply)|\d+\s*comments?|related (posts?|recipes?)|you (might|may) also like|home\s*[>»]|©|all rights reserved|privacy policy|terms of (service|use)|cookie(s)?( policy| settings)?|pin(\s*it)?|tweet|email this|log in|sign in|search|menu|skip to (content|recipe)|about (us|me)|contact( us)?|(facebook|instagram|pinterest|twitter|youtube|tiktok)|\d+(\.\d+)?\s*(stars?|votes?|ratings?)|prep time|cook time|total time|servings?|yield|calories|nutrition( facts| information)?)/i;

function parseIngredientLine(line){
  line = line.replace(/^[-*•\u2022]\s*/, '').trim();
  var unitWords = "cups?|tbsp|tablespoons?|tsp|teaspoons?|g|grams?|kg|kilograms?|ml|millilitres?|milliliters?|l|litres?|liters?|oz|ounces?|lbs?|pounds?|cloves?|slices?|pinch(?:es)?|cans?|packets?|sprigs?";
  var re = new RegExp('^([\\d\u00bc\u00bd\u00be\\.\\/\\s]+)?\\s*(' + unitWords + ')?\\.?\\s*(.*)$', 'i');
  var m = line.match(re);
  if(!m || !m[3]) return { name: line, amount: "", unit: "" };
  return { name: m[3].trim(), amount: (m[1]||"").trim(), unit: (m[2]||"").trim() };
}

function heuristicParseRecipeText(text){
  var lines = text.split(/\r?\n/)
    .map(function(l){ return cleanMarkdownLine(l.trim()); })
    .filter(function(l){ return l && l.length > 1 && !NOISE_LINE_RE.test(l); });
  if(lines.length === 0) return { title: "", ingredients: [], steps: [] };
  var title = lines[0];
  var ingredientsIdx = -1, stepsIdx = -1;
  lines.forEach(function(l, i){
    if(ingredientsIdx === -1 && /^ingredients?\b[:\s]*$/i.test(l)) ingredientsIdx = i;
    if(stepsIdx === -1 && /^(method|instructions?|directions?|steps?)\b[:\s]*$/i.test(l)) stepsIdx = i;
  });
  var ingredientLines = [], stepLines = [];
  if(ingredientsIdx > -1 && stepsIdx > ingredientsIdx){
    ingredientLines = lines.slice(ingredientsIdx+1, stepsIdx);
    stepLines = lines.slice(stepsIdx+1, stepsIdx + 60);
  } else {
    lines.slice(1).forEach(function(l){
      if(/^[\d\u00bc\u00bd\u00be]/.test(l) || /^[-*•\u2022]/.test(l)) ingredientLines.push(l);
      else if(l.length > 3) stepLines.push(l);
    });
  }
  var ingredients = ingredientLines.map(parseIngredientLine).filter(function(i){ return i.name && i.name.length < 120; });
  var steps = stepLines.filter(function(l){ return l.length > 3 && l.length < 600 && !/^(ingredients?|method|instructions?|directions?|steps?)[:\s]*$/i.test(l); });
  return { title: title, ingredients: ingredients, steps: steps };
}

function extractYouTubeDescription(html){
  var m = html.match(/"shortDescription":"((?:[^"\\]|\\.)*)"/);
  if(!m) return null;
  try{ return JSON.parse('"' + m[1] + '"'); }catch(e){ return null; }
}

/* parse schema.org Recipe JSON-LD embedded in a page */
function findRecipeInJsonLd(node){
  if(!node) return null;
  if(Array.isArray(node)){
    for(var i=0;i<node.length;i++){
      var found = findRecipeInJsonLd(node[i]);
      if(found) return found;
    }
    return null;
  }
  if(typeof node !== 'object') return null;
  var type = node["@type"];
  var isRecipe = type === "Recipe" || (Array.isArray(type) && type.indexOf("Recipe") > -1);
  if(isRecipe) return node;
  if(node["@graph"]) return findRecipeInJsonLd(node["@graph"]);
  return null;
}
function jsonLdImageToUrl(img){
  if(!img) return null;
  if(typeof img === 'string') return img;
  if(Array.isArray(img)) return jsonLdImageToUrl(img[0]);
  if(typeof img === 'object') return img.url || null;
  return null;
}
function jsonLdInstructionsToSteps(instr){
  if(!instr) return [];
  if(typeof instr === 'string') return instr.split(/\r?\n+/).map(function(s){ return s.trim(); }).filter(Boolean);
  if(Array.isArray(instr)){
    var out = [];
    instr.forEach(function(item){
      if(typeof item === 'string') out.push(item.trim());
      else if(item && item["@type"] === "HowToSection" && item.itemListElement) out = out.concat(jsonLdInstructionsToSteps(item.itemListElement));
      else if(item && item.text) out.push(String(item.text).trim());
      else if(item && item.name) out.push(String(item.name).trim());
    });
    return out.filter(Boolean);
  }
  return [];
}
function extractRecipeFromHtml(html){
  var re = /<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
  var m, recipe = null;
  while((m = re.exec(html))){
    try{
      var data = JSON.parse(m[1]);
      var found = findRecipeInJsonLd(data);
      if(found){ recipe = found; break; }
    }catch(e){ /* not valid JSON, skip */ }
  }
  if(!recipe) return null;
  var ingredientsRaw = recipe.recipeIngredient || recipe.ingredients || [];
  var ingredients = ingredientsRaw.map(parseIngredientLine).filter(function(i){ return i.name; });
  var steps = jsonLdInstructionsToSteps(recipe.recipeInstructions);
  var title = recipe.name || "";
  var image = jsonLdImageToUrl(recipe.image);
  return { title: title, ingredients: ingredients, steps: steps, image: image };
}

function localQuickSteps(recipe){

  });

/* opts: {prompt: string, images: [{mediaType, base64}], useWebSearch: bool} */
function runAI(opts){
  var prompt = opts.prompt;
  var images = opts.images || [];
  var useWebSearch = !!opts.useWebSearch;
  var active = getActiveProvider();

  if(active.mode === "none"){
    return Promise.reject(new Error("NO_API_ACCESS"));
  }

  var isAnthropic = (active.mode === "builtin") || (active.mode === "custom" && active.provider === "anthropic");

  if(isAnthropic){
    var content = images.map(function(img){
      return { type: "image", source: { type: "base64", media_type: img.mediaType, data: img.base64 } };
    }).concat([{ type: "text", text: prompt }]);
    var messages = [{ role: "user", content: images.length ? content : prompt }];
    var body = { model: (active.mode === "custom" ? (active.model || "claude-sonnet-5") : "claude-sonnet-4-6"), max_tokens: 1500, messages: messages };
    if(useWebSearch) body.tools = [{ type: "web_search_20250305", name: "web_search" }];

    var headers = { "Content-Type": "application/json" };
    if(active.mode === "custom"){
      headers["x-api-key"] = active.apiKey;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    }
    return fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: headers, body: JSON.stringify(body) })
      .catch(function(err){ var e = new Error("NO_API_ACCESS"); e.cause = err; throw e; })
      .then(function(res){
        if(active.mode === "builtin" && (res.status === 401 || res.status === 403)) throw new Error("NO_API_ACCESS");
        if(!res.ok){
          return res.json().catch(function(){ return null; }).then(function(errData){
            var msg = errData && errData.error && errData.error.message ? errData.error.message : ("API error " + res.status);
            throw new Error(msg);
          });
        }
        return res.json();
      }).then(function(data){
        return data.content.filter(function(b){ return b.type === "text"; }).map(function(b){ return b.text; }).join("\n");
      });
  }

  /* custom OpenAI */
  var oContent = images.map(function(img){
    return { type: "image_url", image_url: { url: "data:" + img.mediaType + ";base64," + img.base64 } };
  }).concat([{ type: "text", text: prompt }]);
  var oMessages = [{ role: "user", content: images.length ? oContent : prompt }];
  var oModel = useWebSearch ? "gpt-4o-search-preview" : (active.model || "gpt-4o");
  var oBody = { model: oModel, max_tokens: 1500, messages: oMessages };
  if(useWebSearch) oBody.web_search_options = {};
  return fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + active.apiKey },
    body: JSON.stringify(oBody)
  }).catch(function(err){ var e = new Error("NO_API_ACCESS"); e.cause = err; throw e; })
    .then(function(res){
      if(!res.ok){
        return res.json().catch(function(){ return null; }).then(function(errData){
          var msg = errData && errData.error && errData.error.message ? errData.error.message : ("API error " + res.status);
          throw new Error(msg);
        });
      }
      return res.json();
    }).then(function(data){
      return (data.choices && data.choices[0] && data.choices[0].message) ? data.choices[0].message.content : "";
    });
}

function escapeRegex(str){

/* Inserts (amount unit) after the first mention of each ingredient name across the steps */
function annotateStepsWithQuantities(recipe, steps){
  var seen = {};
  return steps.map(function(step){
    var result = step;
    (recipe.ingredients||[]).forEach(function(ing){
      if(!ing.name || !ing.name.trim()) return;
      var key = ing.name.toLowerCase();
      if(seen[key]) return;
      var qty = (ing.amount + ' ' + ing.unit).trim();
      if(!qty) return;
      var re;
      try{ re = new RegExp('\\b(' + escapeRegex(ing.name.trim()) + ')\\b', 'i'); }catch(e){ return; }
      if(re.test(result)){
        seen[key] = true;
        result = result.replace(re, function(m){ return m + ' (' + qty + ')'; });
      }
    });
    return result;
  });
}

function generateQuickSteps(recipe){
  var prompt = "Condense this recipe's method into a shorter, faster-to-scan version for someone short on time. " +
    "Combine or drop minor detail but keep every essential action and any critical timing/temperature. Aim for roughly half as many steps where sensible.\n\n" +
    "Title: " + recipe.title + "\n" +
    "Current steps:\n" + (recipe.steps||[]).map(function(s,i){ return (i+1) + ". " + s; }).join("\n") + "\n\n" +
    "Respond with ONLY valid JSON, no markdown fences, no preamble: {\"steps\": [\"...\", \"...\"]}";
  return runAI({ prompt: prompt, images: [], useWebSearch: false }).then(function(text){

function autoFindCoverPhoto(title){

    "(a real food photo, ideally hosted on a recipe or food site, ending in a normal image extension where possible). " +
    "Respond with ONLY valid JSON, no markdown fences, no preamble: {\"imageUrl\": \"https://...\"} or {\"imageUrl\": null} if nothing suitable is found.";

function parseJsonLoose(text){
  var t = text.trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  var start = t.indexOf('{');
  var end = t.lastIndexOf('}');
  if(start >= 0 && end > start) t = t.slice(start, end+1);
  return JSON.parse(t);
}

function startSyncListeners(){

    try{ applyRemoteRecipes(snap); }catch(e){ setSyncError(e); return; }
    if(!snap.metadata.fromCache) sync.gotRecipes = true;
    maybeSyncReady();
  }, setSyncError));
  sync.unsubs.push(metaRef().onSnapshot({ includeMetadataChanges: true }, function(doc){
    if(doc.metadata.hasPendingWrites) return;
    var changed = false;
    var unknownYet = doc.metadata.fromCache && !doc.exists;
    if(!unknownYet){
      try{ changed = applyRemoteMeta(doc); }catch(e){ setSyncError(e); return; }
      sync.gotMeta = true;
    }
    if(changed) saveState(true);
    maybeSyncReady();
  }, setSyncError));

/* push only starts once we've seen what's already in the cloud, so a fresh device can never overwrite newer cloud data */
function maybeSyncReady(){
  if(sync.ready || !sync.gotRecipes || !sync.gotMeta) return;
  sync.ready = true;
  pushChanges();
}

function applyRemoteRecipes(snap){
  var meta = state.syncMeta, changed = false, needsPush = false;
  snap.docChanges().forEach(function(change){
    if(change.type === 'removed') return;
    if(change.doc.metadata && change.doc.metadata.hasPendingWrites) return;
    var id = change.doc.id;
    var data = change.doc.data() || {};
    var idx = indexOfRecipe(id);
    var local = idx > -1 ? state.recipes[idx] : null;
    var remoteTs = data.updatedAt || 0;
    var localDirty = !!local && meta.hashes[id] !== recipeHash(local);

    if(data.deleted){
      if(!local){ meta.deleted[id] = Math.max(meta.deleted[id] || 0, remoteTs); return; }
      if(localDirty || (local.updatedAt || 0) > remoteTs){
        /* edited here after it was deleted elsewhere: keep it and push it back up */
        delete meta.hashes[id]; needsPush = true; return;
      }
      state.recipes.splice(idx, 1);
      delete meta.hashes[id];
      meta.deleted[id] = remoteTs;
      if(ui.openRecipeId === id) ui.openRecipeId = null;
      changed = true;
      return;
    }

    if(localDirty){ needsPush = true; return; }                       /* unsent local edits win */
    if(local && (local.updatedAt || 0) >= remoteTs) return;            /* already have this version */
    if(!local && (meta.deleted[id] || 0) >= remoteTs) return;          /* deleted here more recently */
    var rec = data;
    delete rec.deleted;
    rec.id = id;
    if(local) state.recipes[idx] = rec; else state.recipes.push(rec);
    meta.hashes[id] = recipeHash(rec);
    delete meta.deleted[id];
    changed = true;
  });
  if(changed){
    state.recipes.sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
    saveState(true);
  }
  if(needsPush) scheduleSyncPush();
}

/* returns true if local data changed */
function applyRemoteMeta(doc){
  var meta = state.syncMeta;
  if(!doc.exists){ meta.metaSynced = true; return false; }
  var data = doc.data() || {};
  var remoteTs = data.updatedAt || 0;

  if(!meta.metaSynced){
    /* first time this device meets the cloud copy: merge, don't overwrite */
    var names = {};
    state.pantry.forEach(function(p){ names[String(p.name).toLowerCase()] = true; });
    (data.pantry || []).forEach(function(p){
      var key = String(p.name).toLowerCase();
      if(!names[key]){ state.pantry.push(p); names[key] = true; }
    });
    var ids = {};
    state.shopping.forEach(function(s){ ids[s.id] = true; });
    (data.shopping || []).forEach(function(s){ if(!ids[s.id]){ state.shopping.push(s); ids[s.id] = true; } });
    Object.keys(data.settings || {}).forEach(function(k){
      if(k !== 'apiConfig' && k !== 'firebaseConfig') state.settings[k] = data.settings[k];
    });
    meta.metaSynced = true;
    meta.metaHash = null;               /* forces the merged result to be pushed */
    return true;
  }

  if(meta.metaHash !== currentMetaHash()) return false;   /* unsent local changes win */
  if(remoteTs <= (meta.metaUpdatedAt || 0)) return false; /* nothing newer */
  state.pantry = data.pantry || [];
  state.shopping = data.shopping || [];
  Object.keys(data.settings || {}).forEach(function(k){
    if(k !== 'apiConfig' && k !== 'firebaseConfig') state.settings[k] = data.settings[k];
  });
  meta.metaUpdatedAt = remoteTs;
  meta.metaHash = currentMetaHash();
  return true;
}

function scheduleSyncPush(){
  if(!syncIsActive() || !sync.ready) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushChanges, 1200);
}

/* Firestore documents max out at 1 MiB, so trim the oldest "my make" photos if a recipe is too big to sync whole */
function recipeToRemote(r){
  var copy = JSON.parse(JSON.stringify(r));
  copy.deleted = false;
  var LIMIT = 900000;
  while(JSON.stringify(copy).length > LIMIT && copy.makePhotos && copy.makePhotos.length){
    copy.makePhotos.shift(); sync.trimmed = true;
  }
  if(JSON.stringify(copy).length > LIMIT && copy.cover && String(copy.cover).indexOf('data:') === 0){
    copy.cover = null; sync.trimmed = true;
  }
  return copy;
}

function pushChanges(){
  if(!syncIsActive() || !sync.ready) return Promise.resolve();
  if(sync.pushing){ sync.pushAgain = true; return Promise.resolve(); }
  sync.pushing = true;
  var meta = state.syncMeta;
  var now = Date.now();
  var ops = [];
  var currentIds = {};

  state.recipes.forEach(function(r){
    currentIds[r.id] = true;
    var h = recipeHash(r);
    if(meta.hashes[r.id] !== h){
      r.updatedAt = now;
      ops.push({ ref: recipesRef().doc(r.id), data: recipeToRemote(r),
        after: function(){ meta.hashes[r.id] = h; delete meta.deleted[r.id]; } });
    }
  });
  Object.keys(meta.hashes).forEach(function(id){
    if(!currentIds[id]){
      ops.push({ ref: recipesRef().doc(id), data: { deleted: true, updatedAt: now },
        after: function(){ delete meta.hashes[id]; meta.deleted[id] = now; } });
    }
  });
  var mh = currentMetaHash();
  if(meta.metaHash !== mh){
    var payload = metaPayload();
    payload.updatedAt = now;
    ops.push({ ref: metaRef(), data: JSON.parse(JSON.stringify(payload)),
      after: function(){ meta.metaHash = mh; meta.metaUpdatedAt = now; } });
  }

  if(!ops.length){
    sync.pushing = false;
    if(sync.status !== "synced"){ sync.status = "synced"; sync.error = ""; sync.lastSync = Date.now(); render(); }
    return Promise.resolve();
  }

  sync.status = "syncing";
  render();
  var chain = Promise.resolve();
  for(var i = 0; i < ops.length; i += 400){
    (function(chunk){
      chain = chain.then(function(){
        var batch = sync.db.batch();
        chunk.forEach(function(op){ batch.set(op.ref, op.data); });
        return batch.commit().then(function(){ chunk.forEach(function(op){ op.after(); }); });
      });
    })(ops.slice(i, i + 400));
  }
  return chain.then(function(){
    sync.status = "synced"; sync.error = ""; sync.lastSync = Date.now();
  }).catch(function(err){
    sync.status = "error"; sync.error = friendlySyncError(err);
  }).then(function(){
    sync.pushing = false;
    saveState(true);
    if(sync.pushAgain){ sync.pushAgain = false; scheduleSyncPush(); }
  });
}

function attachSyncHandlers(){
  var sd = ensureSyncDraft();
  var emailEl = document.getElementById('sync-email');
  var passEl = document.getElementById('sync-password');
  if(emailEl) emailEl.oninput = function(){ sd.email = emailEl.value; };
  if(passEl){
    passEl.oninput = function(){ sd.password = passEl.value; };
    passEl.onkeydown = function(e){ if(e.key === 'Enter') runAuth('signin'); };
  }

  function runAuth(kind){
    if(emailEl) sd.email = emailEl.value.trim();
    if(passEl) sd.password = passEl.value;
    if(!sd.email || !sd.password){ sd.error = "Enter your email and password."; sd.info = ""; render(); return; }
    if(!sync.auth){ sd.error = "Not connected yet — try again in a moment."; render(); return; }
    sd.busy = true; sd.error = ""; sd.info = "";
    render();
    var p = (kind === 'create')
      ? sync.auth.createUserWithEmailAndPassword(sd.email, sd.password)
      : sync.auth.signInWithEmailAndPassword(sd.email, sd.password);
    p.then(function(){ sd.password = ""; }).catch(function(err){ sd.error = friendlySyncError(err); }).then(function(){
      sd.busy = false; render();
    });
  }
  var signInBtn = document.getElementById('sync-signin-btn');
  if(signInBtn) signInBtn.onclick = function(){ runAuth('signin'); };
  var createBtn = document.getElementById('sync-create-btn');
  if(createBtn) createBtn.onclick = function(){ runAuth('create'); };
  var resetBtn = document.getElementById('sync-reset-btn');
  if(resetBtn) resetBtn.onclick = function(){
    if(emailEl) sd.email = emailEl.value.trim();
    if(!sd.email){ sd.error = "Enter your email first, then press Forgot password."; sd.info = ""; render(); return; }
    sd.busy = true; sd.error = ""; sd.info = ""; render();
    sync.auth.sendPasswordResetEmail(sd.email).then(function(){
      sd.info = "Password reset email sent — check your inbox (and spam).";
    }).catch(function(err){ sd.error = friendlySyncError(err); }).then(function(){ sd.busy = false; render(); });
  };

  var nowBtn = document.getElementById('sync-now-btn');
  if(nowBtn) nowBtn.onclick = function(){ pushChanges(); };
  var retryBtn = document.getElementById('sync-retry-btn');
  if(retryBtn) retryBtn.onclick = function(){ initSync(); };
  ['sync-signout-btn', 'header-signout-btn'].forEach(function(id){
    var b = document.getElementById(id);
    if(b) b.onclick = function(){ if(sync.auth) sync.auth.signOut().catch(function(err){ setSyncError(err); }); };
  });
}

/* ---------- focus-preserving re-render ---------- */
function withFocusPreserved(fn){
  var active = document.activeElement;
  var id = active && active.id;
  var selStart, selEnd;
  if(id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')){
    try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){}
  }
  fn();
  if(id){
    var el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart !== undefined){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function render(){
  try{
    withFocusPreserved(function(){
      root.innerHTML = renderApp();
      attachHandlers();
    });
    if(ui.loaded) root.setAttribute('data-ready', '1');
  }catch(err){
    showFatalError(err);
  }
}

function showFatalError(err){
  var msg = (err && err.message) ? err.message : String(err);
  var stack = (err && err.stack) ? err.stack : "";
  root.innerHTML = '<div style="padding:24px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.5;">' +
    '<strong>Recipe Box hit an error and couldn\'t load.</strong>\n\nPlease send this to Claude so it can be fixed:\n\n' +
    msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') +
    (stack ? ('\n\n' + stack.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')) : '') +
    '</div>';
}

function getAllTags(){
  var s = {};
  state.recipes.forEach(function(r){ (r.tags||[]).forEach(function(t){ s[t]=true; }); });

}
function getFilteredRecipes(){
  var q = ui.search.toLowerCase();
  return state.recipes.filter(function(r){
    var matchesSearch = !q || r.title.toLowerCase().indexOf(q) > -1 ||
      (r.ingredients||[]).some(function(i){ return i.name.toLowerCase().indexOf(q) > -1; });
    var matchesFilters = ui.activeFilters.length === 0 || ui.activeFilters.every(function(f){ return (r.tags||[]).indexOf(f) > -1; });
    return matchesSearch && matchesFilters;
  });
}

/* ---------- reading form values back from DOM (uncontrolled inputs) ---------- */
function syncDraftFromDom(){
  var d = ui.draft;
  var titleEl = document.getElementById('title-input');
  if(titleEl) d.title = titleEl.value;
  var urlEl = document.getElementById('url-input');
  if(urlEl) d.url = urlEl.value;
  d.ingredients.forEach(function(ing, i){
    var n = document.getElementById('ing-name-'+i), a = document.getElementById('ing-amount-'+i), u = document.getElementById('ing-unit-'+i);
    if(n) ing.name = n.value;
    if(a) ing.amount = a.value;
    if(u) ing.unit = u.value;
  });
  d.steps.forEach(function(s, i){
    var el = document.getElementById('step-'+i);
    if(el) d.steps[i] = el.value;
  });
}

/* ---------- event wiring ---------- */
function attachHandlers(){
  if(ui.loaded && !sync.user){ attachSyncHandlers(); return; }
  var exportBtn = document.getElementById('export-btn');
  if(exportBtn) exportBtn.onclick = exportBackup;
  var settingsExportBtn = document.getElementById('settings-export-btn');
  if(settingsExportBtn) settingsExportBtn.onclick = exportBackup;
  var importInput = document.getElementById('import-input');
  if(importInput) importInput.onchange = importBackup;
  var headerOut = document.getElementById('header-signout-btn');
  if(headerOut) headerOut.onclick = function(){ if(sync.auth) sync.auth.signOut().catch(function(err){ setSyncError(err); }); };
  var syncChipBtn = document.getElementById('sync-chip-btn');
  if(syncChipBtn) syncChipBtn.onclick = function(){ ui.tab = "settings"; ui.openRecipeId = null; render(); };

  var tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(function(btn){
    btn.onclick = function(){ ui.tab = btn.getAttribute('data-tab'); ui.openRecipeId = null; render(); };
  });

  if(ui.tab === "recipes"){
    var openRecipe = state.recipes.find(function(r){ return r.id === ui.openRecipeId; });
    if(!openRecipe){
      attachRecipeListHandlers();
    } else {
      attachRecipeDetailHandlers(openRecipe);
    }
  } else if(ui.tab === "pantry"){
    attachPantryHandlers();
  } else if(ui.tab === "settings"){
    attachSettingsHandlers();
  }

  if(ui.showAdd){
    attachModalHandlers();
  }
}

function attachRecipeListHandlers(){
  var searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.oninput = function(){ ui.search = searchInput.value; render(); };
  }
  var addBtn = document.getElementById('add-recipe-btn');
  if(addBtn) addBtn.onclick = function(){ ui.draft = freshDraft(); ui.editingRecipeId = null; ui.showAdd = true; render(); };

  document.querySelectorAll('.filter-chip').forEach(function(chip){
    chip.onclick = function(){
      var t = chip.getAttribute('data-tag');
      var idx = ui.activeFilters.indexOf(t);
      if(idx>-1) ui.activeFilters.splice(idx,1); else ui.activeFilters.push(t);
      render();
    };
  });

  document.querySelectorAll('[data-open]').forEach(function(card){
    card.onclick = function(){
      ui.openRecipeId = card.getAttribute('data-open');
      ui.detailLayoutOverride = null;
      ui.detailQuantitiesOverride = null;
      ui.detailLevelOverride = null;
      ui.confirmDeleteId = null;
      render();
    };
  });
}

function attachRecipeDetailHandlers(r){
  var backBtn = document.getElementById('back-to-list');
  if(backBtn) backBtn.onclick = function(){ ui.openRecipeId = null; render(); };

  var addShopBtn = document.getElementById('add-to-shopping');
  if(addShopBtn) addShopBtn.onclick = function(){
    var items = (r.ingredients||[]).map(function(i){ return (i.amount + " " + i.unit + " " + i.name).trim(); });
    items.forEach(function(name){ state.shopping.push({id:uid(), name:name, checked:false}); });
    saveState();
  };

  var makePhotoInput = document.getElementById('make-photo-input');
  if(makePhotoInput){
    makePhotoInput.onchange = function(e){
      var file = e.target.files[0];
      if(!file) return;
      resizeImage(file, 700, 0.7).then(function(dataUrl){
        r.makePhotos = (r.makePhotos||[]).concat([dataUrl]);
        saveState();
      });
    };
  }

  var toggleLayoutBtn = document.getElementById('toggle-layout');
  if(toggleLayoutBtn) toggleLayoutBtn.onclick = function(){
    var current = ui.detailLayoutOverride || r.layoutOverride || state.settings.layout;
    ui.detailLayoutOverride = current === "bullets" ? "detailed" : "bullets";
    render();
  };

  var toggleQtyBtn = document.getElementById('toggle-quantities');
  if(toggleQtyBtn) toggleQtyBtn.onclick = function(){
    var current = ui.detailQuantitiesOverride !== null ? ui.detailQuantitiesOverride : state.settings.showQuantities;
    ui.detailQuantitiesOverride = !current;
    render();
  };

  var toggleDetailBtn = document.getElementById('toggle-detail-level');
  if(toggleDetailBtn) toggleDetailBtn.onclick = function(){
    var current = ui.detailLevelOverride || state.settings.detailLevel;
    var next = current === "quick" ? "detailed" : "quick";
    if(next === "quick" && !(r.stepsQuick && r.stepsQuick.length)){
      if(getActiveProvider().mode === "none"){
        r.stepsQuick = localQuickSteps(r);
        ui.detailLevelOverride = "quick";
        saveState();
        return;
      }
      ui.summarizeLoadingId = r.id;
      render();
      generateQuickSteps(r).then(function(quickSteps){
        r.stepsQuick = quickSteps;
        ui.summarizeLoadingId = null;
        ui.detailLevelOverride = "quick";
        saveState();
      }).catch(function(err){
        ui.summarizeLoadingId = null;
        render();
        alert(friendlyErrorMessage(err, "Couldn't generate a quick summary right now. Try again in a moment."));
      });
    } else {
      ui.detailLevelOverride = next;
      render();
    }
  };

  var editBtn = document.getElementById('edit-recipe-btn');
  if(editBtn) editBtn.onclick = function(){ openEditModal(r); };

  var shareDownloadBtn = document.getElementById('share-download-btn');
  if(shareDownloadBtn) shareDownloadBtn.onclick = function(){ exportSingleRecipe(r); };
  var shareCopyBtn = document.getElementById('share-copy-btn');
  if(shareCopyBtn) shareCopyBtn.onclick = function(){ copyRecipeAsText(r); };

  var askDeleteBtn = document.getElementById('ask-delete');
  if(askDeleteBtn) askDeleteBtn.onclick = function(){ ui.confirmDeleteId = r.id; render(); };
  var confirmDeleteBtn = document.getElementById('confirm-delete');
  if(confirmDeleteBtn) confirmDeleteBtn.onclick = function(){
    state.recipes = state.recipes.filter(function(x){ return x.id !== r.id; });
    ui.openRecipeId = null; ui.confirmDeleteId = null;
    saveState();
  };
  var cancelDeleteBtn = document.getElementById('cancel-delete');
  if(cancelDeleteBtn) cancelDeleteBtn.onclick = function(){ ui.confirmDeleteId = null; render(); };
}

function attachPantryHandlers(){
  document.querySelectorAll('[data-shop-toggle]').forEach(function(cb){
    cb.onchange = function(){
      var id = cb.getAttribute('data-shop-toggle');
      var item = state.shopping.find(function(i){ return i.id === id; });
      if(item) item.checked = !item.checked;
      saveState();
    };
  });
  document.querySelectorAll('[data-shop-remove]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-shop-remove');
      state.shopping = state.shopping.filter(function(i){ return i.id !== id; });
      saveState();
    };
  });
  document.querySelectorAll('[data-pantry-remove]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-pantry-remove');
      state.pantry = state.pantry.filter(function(i){ return i.id !== id; });
      saveState();
    };
  });
  var shopAddBtn = document.getElementById('shop-add-btn');
  var shopInput = document.getElementById('shop-input');
  function addShop(){
    if(shopInput && shopInput.value.trim()){
      state.shopping.push({id:uid(), name:shopInput.value.trim(), checked:false});
      saveState();
    }
  }
  if(shopAddBtn) shopAddBtn.onclick = addShop;
  if(shopInput) shopInput.onkeydown = function(e){ if(e.key==='Enter') addShop(); };

  var pantryAddBtn = document.getElementById('pantry-add-btn');
  var pantryInput = document.getElementById('pantry-input');
  function addPantry(){
    if(pantryInput && pantryInput.value.trim()){
      state.pantry.push({id:uid(), name:pantryInput.value.trim()});
      saveState();
    }
  }
  if(pantryAddBtn) pantryAddBtn.onclick = addPantry;
  if(pantryInput) pantryInput.onkeydown = function(e){ if(e.key==='Enter') addPantry(); };
}

function attachSettingsHandlers(){
  document.querySelectorAll('[data-set-units]').forEach(function(btn){
    btn.onclick = function(){ state.settings.units = btn.getAttribute('data-set-units'); saveState(); };
  });
  document.querySelectorAll('[data-set-layout]').forEach(function(btn){
    btn.onclick = function(){ state.settings.layout = btn.getAttribute('data-set-layout'); saveState(); };
  });
  document.querySelectorAll('[data-set-qty]').forEach(function(btn){
    btn.onclick = function(){ state.settings.showQuantities = btn.getAttribute('data-set-qty') === 'on'; saveState(); };
  });
  document.querySelectorAll('[data-set-detail]').forEach(function(btn){
    btn.onclick = function(){ state.settings.detailLevel = btn.getAttribute('data-set-detail'); saveState(); };
  });

  if(!ui.apiDraft){
    var cfg = state.settings.apiConfig || { enabled:false, provider:"anthropic", apiKey:"", model:"" };
    ui.apiDraft = { enabled: !!cfg.enabled, provider: cfg.provider || "anthropic", apiKey: cfg.apiKey || "", model: cfg.model || "" };
  }
  var ad = ui.apiDraft;

  function syncApiDraftFromDom(){
    var keyEl = document.getElementById('api-key-input');
    var modelEl = document.getElementById('api-model-input');
    if(keyEl) ad.apiKey = keyEl.value;
    if(modelEl) ad.model = modelEl.value;
  }

  document.querySelectorAll('[data-api-enabled]').forEach(function(btn){
    btn.onclick = function(){ syncApiDraftFromDom(); ad.enabled = btn.getAttribute('data-api-enabled') === 'on'; render(); };
  });
  document.querySelectorAll('[data-api-provider]').forEach(function(btn){
    btn.onclick = function(){ syncApiDraftFromDom(); ad.provider = btn.getAttribute('data-api-provider'); render(); };
  });
  var saveApiBtn = document.getElementById('save-api-settings-btn');
  if(saveApiBtn) saveApiBtn.onclick = function(){
    syncApiDraftFromDom();
    state.settings.apiConfig = { enabled: ad.enabled, provider: ad.provider, apiKey: ad.apiKey.trim(), model: ad.model.trim() };
    saveState();
  };
  var clearApiBtn = document.getElementById('clear-api-settings-btn');
  if(clearApiBtn) clearApiBtn.onclick = function(){
    ui.apiDraft = { enabled: false, provider: "anthropic", apiKey: "", model: "" };
    state.settings.apiConfig = { enabled: false, provider: "anthropic", apiKey: "", model: "" };
    saveState();
  };

  attachSyncHandlers();
}

function attachModalHandlers(){
  var overlay = document.getElementById('modal-overlay');
  if(overlay) overlay.onclick = function(e){ if(e.target === overlay){ ui.showAdd = false; ui.editingRecipeId = null; render(); } };
  var closeBtn = document.getElementById('modal-close-btn');
  if(closeBtn) closeBtn.onclick = function(){ ui.showAdd = false; ui.editingRecipeId = null; render(); };

  document.querySelectorAll('.add-mode-tabs [data-mode]').forEach(function(btn){
    btn.onclick = function(){ syncDraftFromDom(); ui.draft.mode = btn.getAttribute('data-mode'); ui.draft.error=""; render(); };
  });

  var d = ui.draft;

  document.querySelectorAll('[data-extract-mode]').forEach(function(btn){
    btn.onclick = function(){ syncDraftFromDom(); d.useLocalExtraction = btn.getAttribute('data-extract-mode') === 'local'; d.error=""; render(); };
  });

  var photoInput = document.getElementById('photo-input');
  if(photoInput){
    photoInput.onchange = function(e){
      var files = Array.prototype.slice.call(e.target.files, 0, 5);
      d.photoFiles = files;
      Promise.all(files.map(function(f){ return resizeImage(f, 500, 0.6); })).then(function(previews){
        d.photoPreviews = previews;
        render();
      });
    };
  }
  var extractPhotoBtn = document.getElementById('extract-photo-btn');
  if(extractPhotoBtn) extractPhotoBtn.onclick = function(){ d.useLocalExtraction ? extractFromPhotosLocal() : extractFromPhotos(); };

  var urlInput = document.getElementById('url-input');
  if(urlInput) urlInput.oninput = function(){ d.url = urlInput.value; };
  var extractUrlBtn = document.getElementById('extract-url-btn');
  if(extractUrlBtn) extractUrlBtn.onclick = function(){ d.useLocalExtraction ? extractFromUrlLocal() : extractFromUrl(); };

  if(d.mode === "manual"){
    var titleInput = document.getElementById('title-input');
    if(titleInput) titleInput.oninput = function(){ d.title = titleInput.value; };

    var coverInput = document.getElementById('cover-input');
    if(coverInput){
      coverInput.onchange = function(e){
        var file = e.target.files[0];
        if(!file) return;
        resizeImage(file, 700, 0.7).then(function(dataUrl){ d.cover = dataUrl; d.coverIsWebLink = false; render(); });
      };
    }

    var autoCoverBtn = document.getElementById('auto-cover-btn');
    if(autoCoverBtn){
      autoCoverBtn.onclick = function(){
        syncDraftFromDom();
        if(!d.title.trim()){ d.error = "Add a title first so I know what to search for."; render(); return; }
        if(getActiveProvider().mode === "none"){
          d.error = "Auto photo search needs API access (no local/no-AI version of this one) \u2014 upload your own photo instead, or import from a recipe link, which can often grab the site's own photo for free.";
          render();
          return;
        }
        d.coverLoading = true; d.error = "";
        render();
        autoFindCoverPhoto(d.title.trim()).then(function(url){
          d.coverLoading = false;
          if(url){ d.cover = url; d.coverIsWebLink = true; }
          else { d.error = "Couldn't find a photo automatically \u2014 try uploading one instead."; }
          render();
        }).catch(function(err){
          d.coverLoading = false;
          d.error = friendlyErrorMessage(err, "Couldn't find a photo automatically \u2014 try uploading one instead.");
          render();
        });
      };
    }

    document.querySelectorAll('[data-ing-field]').forEach(function(el){
      el.oninput = function(){
        var idx = parseInt(el.getAttribute('data-ing-idx'), 10);
        var field = el.getAttribute('data-ing-field');
        d.ingredients[idx][field] = el.value;
      };
    });
    document.querySelectorAll('[data-remove-ing]').forEach(function(btn){
      btn.onclick = function(){
        syncDraftFromDom();
        var idx = parseInt(btn.getAttribute('data-remove-ing'), 10);
        d.ingredients.splice(idx,1);
        if(d.ingredients.length===0) d.ingredients.push({name:"",amount:"",unit:""});
        render();
      };
    });
    var addIngBtn = document.getElementById('add-ing-row');
    if(addIngBtn) addIngBtn.onclick = function(){ syncDraftFromDom(); d.ingredients.push({name:"",amount:"",unit:""}); render(); };

    document.querySelectorAll('[data-step-idx]').forEach(function(el){
      el.oninput = function(){
        var idx = parseInt(el.getAttribute('data-step-idx'), 10);
        d.steps[idx] = el.value;
      };
    });
    document.querySelectorAll('[data-remove-step]').forEach(function(btn){
      btn.onclick = function(){
        syncDraftFromDom();
        var idx = parseInt(btn.getAttribute('data-remove-step'), 10);
        d.steps.splice(idx,1);
        if(d.steps.length===0) d.steps.push("");
        render();
      };
    });
    var addStepBtn = document.getElementById('add-step-row');
    if(addStepBtn) addStepBtn.onclick = function(){ syncDraftFromDom(); d.steps.push(""); render(); };

    document.querySelectorAll('.draft-tag').forEach(function(chip){
      chip.onclick = function(){
        syncDraftFromDom();
        var t = chip.getAttribute('data-tag');
        var idx = d.tags.indexOf(t);
        if(idx>-1) d.tags.splice(idx,1); else d.tags.push(t);
        render();
      };
    });

    var saveBtn = document.getElementById('save-recipe-btn');
    if(saveBtn) saveBtn.onclick = function(){
      syncDraftFromDom();
      if(!d.title.trim()){ d.error = "Give the recipe a title first."; render(); return; }
      var cleanIngredients = d.ingredients.filter(function(i){ return i.name.trim(); });
      var cleanSteps = d.steps.filter(function(s){ return s.trim(); });

      if(ui.editingRecipeId){
        var existing = state.recipes.find(function(x){ return x.id === ui.editingRecipeId; });
        if(existing){
          existing.title = d.title.trim();
          existing.cover = d.cover;
          existing.coverIsWebLink = !!d.coverIsWebLink;
          existing.ingredients = cleanIngredients;
          existing.steps = cleanSteps;
          existing.tags = d.tags;
          existing.originalUrl = d.url || existing.originalUrl;
          existing.stepsQuick = null;
        }
        ui.editingRecipeId = null;
        ui.showAdd = false;
        saveState();
        return;
      }

      var newRecipe = {
        id: uid(),
        createdAt: Date.now(),
        title: d.title.trim(),
        cover: d.cover,
        ingredients: cleanIngredients,
        steps: cleanSteps,
        tags: d.tags,
        makePhotos: [],
        coverIsWebLink: !!d.coverIsWebLink,
        originalUrl: d.url || undefined
      };
      state.recipes.unshift(newRecipe);
      ui.showAdd = false;
      saveState();
    };
  }
}

function extractFromPhotos(){
  var d = ui.draft;
  if(d.photoFiles.length === 0){ d.error = "Add at least one photo first."; render(); return; }
  d.loading = true; d.error = "";
  render();
  Promise.all(d.photoFiles.map(function(f){ return resizeImage(f, 1200, 0.8); })).then(function(fullSize){
    var images = fullSize.map(function(dataUrl){
      return { mediaType: "image/jpeg", base64: dataUrl.split(",")[1] };
    });
    var prompt = "Look at these photo(s) of a recipe or dish. Extract or reconstruct a full recipe. Respond with ONLY valid JSON, no markdown fences, no preamble, in this exact shape:\n" +
      '{"title": "...", "ingredients": [{"name":"...","amount":"...","unit":"..."}], "steps": ["...","..."], "tags": ["choose from: ' + ALL_TAGS.join(", ") + '"]}\n' +
      "If the photo shows a handwritten or printed recipe, transcribe it faithfully. If it shows a finished dish with no text, infer a plausible recipe for that dish. Keep step text concise and actionable.";
    return runAI({ prompt: prompt, images: images, useWebSearch: false });
  }).then(function(text){
    var parsed = parseJsonLoose(text);
    d.title = parsed.title || "";
    d.ingredients = (parsed.ingredients && parsed.ingredients.length) ? parsed.ingredients : [{name:"",amount:"",unit:""}];
    d.steps = (parsed.steps && parsed.steps.length) ? parsed.steps : [""];
    d.tags = parsed.tags || [];
    d.cover = d.photoPreviews[0] || null;
    d.mode = "manual";
    d.loading = false;
    render();
  }).catch(function(err){
    d.error = friendlyErrorMessage(err, "Couldn't read that recipe automatically. Try again, or fill it in manually below.");
    d.loading = false;
    render();
  });
}

    '{"title": "...", "ingredients": [{"name":"...","amount":"...","unit":"..."}], "steps": ["...","..."], "tags": ["choose from: ' + ALL_TAGS.join(", ") + '"]}\n' +
    "Keep ingredient amounts and units as given by the source where possible. Keep steps concise and actionable.";
  runAI({ prompt: prompt, images: [], useWebSearch: true }).then(function(text){
    var parsed = parseJsonLoose(text);

    d.ingredients = (parsed.ingredients && parsed.ingredients.length) ? parsed.ingredients : [{name:"",amount:"",unit:""}];

function extractFromPhotosLocal(){

  if(d.photoFiles.length === 0){ d.error = "Add at least one photo first."; render(); return; }
  d.loading = true; d.error = "";
  render();
  loadTesseract().then(function(){
    return Promise.all(d.photoFiles.map(function(f){
      return Tesseract.recognize(f, 'eng').then(function(result){ return (result.data && result.data.text) || ""; });
    }));
  }).then(function(texts){
    var parsed = heuristicParseRecipeText(texts.join("\n\n"));
    d.title = parsed.title || "";
    d.ingredients = parsed.ingredients.length ? parsed.ingredients : [{name:"",amount:"",unit:""}];
    d.steps = parsed.steps.length ? parsed.steps : [""];
    d.cover = d.photoPreviews[0] || null;
    d.mode = "manual";
    d.loading = false;
    render();
  }).catch(function(err){
    if(hasCloudStorage()){
      d.error = "Text recognition needs to download its language data from an outside site, and this preview only allows requests to a small approved list \u2014 so Local photo import likely can't work from in here. It works when this file is downloaded and opened in your own browser instead, or switch to \u201cAI\u201d above, which does work in this preview.";
    } else {
      d.error = "Couldn't read text from that photo (" + (err && err.message ? err.message : "recognition failed") + "). Try a clearer, well-lit photo, or fill it in manually below.";
    }
    d.loading = false;
    render();
  });
}

function extractFromUrlLocal(){
  var d = ui.draft;
  syncDraftFromDom();
  if(!d.url.trim()){ d.error = "Paste a link first."; render(); return; }
  d.loading = true; d.error = "";
  render();
  var url = d.url.trim();
  var isYouTube = /youtube\.com|youtu\.be/i.test(url);

  function finishWithHeuristic(text, htmlForMeta){
    var parsed = heuristicParseRecipeText(text || "");
    if(htmlForMeta){
      var titleMatch = htmlForMeta.match(/<title>([^<]*)<\/title>/i);
      if(titleMatch && !parsed.title) parsed.title = titleMatch[1].trim().replace(/\s*[|\u2013-]\s*[^|\u2013-]*$/, '');
    }
    d.title = parsed.title || d.title || "";
    d.ingredients = parsed.ingredients.length ? parsed.ingredients : [{name:"",amount:"",unit:""}];
    d.steps = parsed.steps.length ? parsed.steps : [""];
    if(htmlForMeta && !d.cover){
      var imgMatch = htmlForMeta.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i) || htmlForMeta.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
      if(imgMatch){ d.cover = imgMatch[1]; d.coverIsWebLink = true; }
    }
    d.mode = "manual";
    d.loading = false;
    if(!parsed.ingredients.length && !parsed.steps.length){
      d.error = "Couldn't find a structured recipe on that page \u2014 pulled what text I could, so please check it over carefully, or fill it in manually.";
    } else {
      d.error = "Found this with a best-effort, no-AI read of the page \u2014 double-check the ingredients and steps before saving.";
    }
    render();
  }

  fetchRawHtml(url).then(function(html){
    if(!isYouTube){
      var recipe = extractRecipeFromHtml(html);
      if(recipe && (recipe.ingredients.length || recipe.steps.length)){
        d.title = recipe.title || d.title;
        d.ingredients = recipe.ingredients.length ? recipe.ingredients : [{name:"",amount:"",unit:""}];
        d.steps = recipe.steps.length ? recipe.steps : [""];
        if(recipe.image && !d.cover){ d.cover = recipe.image; d.coverIsWebLink = true; }
        d.mode = "manual";
        d.loading = false;
        render();
        return;
      }
    }
    /* no structured data found (or YouTube) - get a cleaner read via the reader service, falling back to raw text if that fails */
    var ytDescription = isYouTube ? extractYouTubeDescription(html) : null;
    if(ytDescription){
      finishWithHeuristic(ytDescription, html);
      return;
    }
    fetchReadableText(url).then(function(readable){
      finishWithHeuristic(readable, html);
    }).catch(function(){
      finishWithHeuristic(stripHtmlTags(html).slice(0, 8000), html);
    });
  }).catch(function(){
    /* raw HTML totally unreachable - last resort is the reader service directly */
    fetchReadableText(url).then(function(readable){
      finishWithHeuristic(readable, null);
    }).catch(function(err){
      if(hasCloudStorage()){
        d.error = "This preview only allows network requests to a small approved list of sites, so Local link import can't reach outside pages from in here. It works when this file is downloaded and opened in your own browser instead \u2014 or switch to \u201cAI\u201d above, which does work in this preview.";
      } else {
        d.error = "Couldn't fetch that page after trying a few different ways (" + (err && err.message ? err.message : "network error") + "). It might be a temporary issue with the fetch services this relies on, an ad-blocker/firewall on your end, or the site actively blocking automated access. Try again in a moment, use \u201cType it in\u201d instead, or use AI import if you have a key set up.";
      }
      d.loading = false;
      render();
    });
  });
}

/* ---------- backup export / import ---------- */
function slugify(str){
  return (str||"recipe").toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || "recipe";
}
function downloadJson(obj, filename){
  var blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
/* backups never include API keys, Firebase config, or per-device sync bookkeeping */
function exportableState(){
  var copy = JSON.parse(JSON.stringify(state));
  delete copy.syncMeta;
  if(copy.settings){ delete copy.settings.apiConfig; delete copy.settings.firebaseConfig; }
  return copy;
}
function exportBackup(){
  downloadJson(exportableState(), "recipe-box-backup-" + new Date().toISOString().slice(0,10) + ".json");
}
function exportSingleRecipe(r){
  var shareable = {
    recipeBoxShare: true,
    title: r.title, cover: r.cover, coverIsWebLink: !!r.coverIsWebLink,
    ingredients: r.ingredients || [], steps: r.steps || [],
    tags: r.tags || [], originalUrl: r.originalUrl
  };
  downloadJson(shareable, slugify(r.title) + ".json");
}
function recipeToPlainText(r){
  var lines = [r.title || "Untitled recipe", ""];
  lines.push("Ingredients:");
  (r.ingredients||[]).forEach(function(i){
    lines.push("- " + [i.amount, i.unit, i.name].filter(function(x){ return x; }).join(" "));
  });
  lines.push("");
  lines.push("Method:");
  (r.steps||[]).forEach(function(s, idx){ lines.push((idx+1) + ". " + s); });
  if(r.originalUrl){ lines.push(""); lines.push("Source: " + r.originalUrl); }
  return lines.join("\n");
}
function copyRecipeAsText(r){
  var text = recipeToPlainText(r);
  function fallbackCopy(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{ document.execCommand('copy'); alert("Recipe copied as text \u2014 paste it anywhere."); }
    catch(e){ alert("Couldn't copy automatically. Here's the text to copy manually:\n\n" + text); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      alert("Recipe copied as text \u2014 paste it anywhere.");
    }).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}
function importBackup(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var imported = JSON.parse(ev.target.result);
      if(imported && Array.isArray(imported.recipes)){
        var haveRecipe = {};
        state.recipes.forEach(function(r){ haveRecipe[r.id] = true; });
        var incoming = (imported.recipes || []).filter(function(r){
          if(!r.id) r.id = uid();
          return !haveRecipe[r.id];
        });
        state.recipes = incoming.concat(state.recipes);
        if(state.pantry.length === 0) state.pantry = imported.pantry || [];
        var haveShop = {};
        state.shopping.forEach(function(s){ haveShop[s.id] = true; });
        state.shopping = state.shopping.concat((imported.shopping || []).filter(function(s){ return !haveShop[s.id]; }));
        if(imported.settings){
          state.settings = Object.assign({}, imported.settings, {
            apiConfig: state.settings.apiConfig,
            firebaseConfig: state.settings.firebaseConfig
          });
        }
        ui.apiDraft = null;
        saveState();
        alert("Backup imported \u2014 recipes merged into your collection.");
      } else if(imported && imported.title && (Array.isArray(imported.ingredients) || Array.isArray(imported.steps))){
        var shared = {
          id: uid(), createdAt: Date.now(),
          title: imported.title || "Untitled recipe",
          cover: imported.cover || null,
          coverIsWebLink: !!imported.coverIsWebLink,
          ingredients: imported.ingredients || [],
          steps: imported.steps || [],
          tags: imported.tags || [],
          makePhotos: [],
          originalUrl: imported.originalUrl
        };
        state.recipes.unshift(shared);
        saveState();
        alert('"' + shared.title + '" was added to your recipes.');
      } else {
        alert("Couldn't read that file. Make sure it's a Recipe Box backup or a shared recipe .json");
      }
    }catch(err){
      alert("Couldn't read that file. Make sure it's a Recipe Box backup or a shared recipe .json");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

loadState();
setTimeout(function(){ if(!ui.loaded){ ui.loaded = true; render(); } }, 6000);
})();
