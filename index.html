        d.steps.splice(idx,1);
        if(d.steps.length===0) d.steps.push("");
        render();
      };
    });
    document.querySelectorAll('[data-move-step]').forEach(function(btn){
      btn.onclick = function(){
        syncDraftFromDom();
        var from = parseInt(btn.getAttribute('data-move-step'), 10), dir = parseInt(btn.getAttribute('data-dir'), 10);
        var to = from + dir;
        if(to < 0 || to >= d.steps.length) return;
        var item = d.steps.splice(from, 1)[0];
        d.steps.splice(to, 0, item);
        render();
        /* keep the finger/cursor on the same button so it can be pressed again to keep moving */
        var again = document.getElementById((dir < 0 ? 'step-up-' : 'step-down-') + to) || document.getElementById((dir < 0 ? 'step-down-' : 'step-up-') + to);
        if(again) again.focus();
      };
    });
    document.querySelectorAll('[data-drag-step]').forEach(function(handle){
      handle.onpointerdown = function(e){
        if(e.button !== undefined && e.button !== 0) return;
        e.preventDefault();
        syncDraftFromDom();
        var from = parseInt(handle.getAttribute('data-drag-step'), 10);
        var rows = Array.prototype.slice.call(document.querySelectorAll('[data-step-row]'));
        var ov = document.querySelector('.overlay');
        var scroll0 = ov ? ov.scrollTop : 0;
        var tops = rows.map(function(r){ return r.getBoundingClientRect().top + scroll0; });
        var heights = rows.map(function(r){ return r.getBoundingClientRect().height; });
        var startY = e.clientY, target = from, dragRow = rows[from];
        dragRow.classList.add('dragging');
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
        function clearMarks(){ rows.forEach(function(r){ r.classList.remove('drop-above', 'drop-below'); }); }
        function move(ev){
          if(ov){
            if(ev.clientY < 70) ov.scrollTop -= 14;
            else if(ev.clientY > window.innerHeight - 70) ov.scrollTop += 14;
          }
          var scrolled = ov ? ov.scrollTop - scroll0 : 0;
          var dy = ev.clientY - startY + scrolled;
          dragRow.style.transform = 'translateY(' + dy + 'px)';
          var cy = tops[from] + heights[from] / 2 + dy;
          var t = 0;
          rows.forEach(function(r, i){ if(i !== from && (tops[i] + heights[i] / 2) < cy) t++; });
          target = t;
          clearMarks();
          if(target < from) rows[target].classList.add('drop-above');
          else if(target > from) rows[target].classList.add('drop-below');
        }
        function finish(commit){
          handle.removeEventListener('pointermove', move);
          handle.removeEventListener('pointerup', up);
          handle.removeEventListener('pointercancel', cancel);
          clearMarks();
          dragRow.classList.remove('dragging'); dragRow.style.transform = '';
          if(commit && target !== from){
            var item = d.steps.splice(from, 1)[0];
            d.steps.splice(target, 0, item);
            render();
          }
        }
        function up(){ finish(true); }
        function cancel(){ finish(false); }
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', up);
        handle.addEventListener('pointercancel', cancel);
      };
    });

    var addStepBtn = document.getElementById('add-step-row');
    if(addStepBtn) addStepBtn.onclick = function(){ syncDraftFromDom(); d.steps.push(""); render(); };

    document.querySelectorAll('.draft-tag').forEach(function(chip){
      chip.onclick = function(){
        syncDraftFromDom();
        var t = chip.getAttribute('data-tag');
        var idx = d.tags.indexOf(t);
        if(idx>-1) d.tags.splice(idx,1); else d.tags.push(t);
        render();
      };
    });

    var tidyDraftBtn = document.getElementById('tidy-draft-btn');
    if(tidyDraftBtn) tidyDraftBtn.onclick = function(){
      syncDraftFromDom();
      var res = tidyRecipeLocal({ title: d.title, ingredients: d.ingredients, steps: d.steps, tags: d.tags });
      d.title = res.title;
      d.ingredients = res.ingredients.length ? res.ingredients : [{name:"",amount:"",unit:""}];
      d.steps = res.steps.length ? res.steps : [""];
      d.tags = res.tags;
      d.error = res.changes.length ? ("Tidied: " + res.changes.join(" \u00b7 ")) : "Already tidy \u2014 nothing to change.";
      render();
    };

    function saveThen(after){
      syncDraftFromDom();
      if(!d.title.trim()){ d.error = "Give the recipe a title first."; render(); return; }
      var sb = document.getElementById('save-recipe-btn');
      var id = ui.editingRecipeId;
      sb.onclick();
      after(id);
    }
    var etb = document.getElementById('edit-tidy-open-btn');
    if(etb) etb.onclick = function(){
      saveThen(function(id){
        var rr = state.recipes.filter(function(x){ return x.id === id; })[0];
        if(!rr) return;
        var res = tidyRecipeLocal(rr);
        ui.tidy = { recipeId: rr.id, source: "local", after: res, changes: res.changes, loading: false, error: "" };
        render();
      });
    };
    var vcb = document.getElementById('ver-current-btn');
    if(vcb) vcb.onclick = function(){ saveThen(function(){ ui.viewOriginalId = null; render(); }); };
    var vob = document.getElementById('ver-original-btn');
    if(vob) vob.onclick = function(){ saveThen(function(id){ ui.viewOriginalId = id; render(); }); };
    var eask = document.getElementById('edit-ask-delete');
    if(eask) eask.onclick = function(){ syncDraftFromDom(); ui.confirmDeleteId = ui.editingRecipeId; render(); };
    var ecan = document.getElementById('edit-cancel-delete');
    if(ecan) ecan.onclick = function(){ syncDraftFromDom(); ui.confirmDeleteId = null; render(); };
    var econ = document.getElementById('edit-confirm-delete');
    if(econ) econ.onclick = function(){
      var id = ui.editingRecipeId;
      state.recipes = state.recipes.filter(function(x){ return x.id !== id; });
      ui.openRecipeId = null; ui.confirmDeleteId = null; ui.editingRecipeId = null; ui.showAdd = false; ui.viewOriginalId = null;
      saveState();
    };

    var saveBtn = document.getElementById('save-recipe-btn');
    if(saveBtn) saveBtn.onclick = function(){
      syncDraftFromDom();
      if(!d.title.trim()){ d.error = "Give the recipe a title first."; render(); return; }
      var cleanIngredients = d.ingredients.filter(function(i){ return i.name.trim(); });
      var cleanSteps = d.steps.filter(function(s){ return s.trim(); });

      if(ui.editingRecipeId){
        var existing = state.recipes.find(function(x){ return x.id === ui.editingRecipeId; });
        if(existing){
          var madeSnap2 = snapshotOriginal(existing), beforeCore2 = coreOf(existing);
          existing.title = d.title.trim();
          existing.time = metaText(d.time); existing.servings = metaText(d.servings);
          existing.cover = d.cover;
          existing.coverIsWebLink = !!d.coverIsWebLink;
          existing.ingredients = cleanIngredients;
          existing.steps = cleanSteps;
          existing.tags = d.tags;
          existing.originalUrl = d.url || existing.originalUrl;
          existing.stepsQuick = null;
          existing.stepsGuided = null;
          dropOriginalIfUnchanged(existing, madeSnap2, beforeCore2);
        }
        ui.editingRecipeId = null;
        ui.showAdd = false;
        saveState();
        return;
      }

      var newRecipe = {
        id: uid(),
        createdAt: Date.now(),
        title: d.title.trim(),
        time: metaText(d.time), servings: metaText(d.servings),
        cover: d.cover,
        ingredients: cleanIngredients,
        steps: cleanSteps,
        tags: d.tags,
        makePhotos: [],
        coverIsWebLink: !!d.coverIsWebLink,
        originalUrl: d.url || undefined
      };
      state.recipes.unshift(newRecipe);
      ui.showAdd = false;
      saveState();
    };
  }
}

    var images = fullSize.map(function(dataUrl){
      return { mediaType: "image/jpeg", base64: dataUrl.split(",")[1] };
    });
    var prompt = "Look at these photo(s) of a recipe or dish. Extract or reconstruct a full recipe. Respond with ONLY valid JSON, no markdown fences, no preamble, in this exact shape:\n" +
      '{"title": "...", "time": "total time e.g. 45 min, or empty if unknown", "servings": "number of portions e.g. 4, or empty if unknown", "ingredients": [{"name":"...","amount":"...","unit":"..."}], "steps": ["...","..."], "tags": ["choose from: ' + ALL_TAGS.join(", ") + '"]}\n' +

function extractFromUrlLocal(){
  var d = ui.draft;
  syncDraftFromDom();
  if(!d.url.trim()){ d.error = "Paste a link first."; render(); return; }
  d.loading = true; d.error = "";
  render();
  var url = d.url.trim();
  var isYouTube = /youtube\.com|youtu\.be/i.test(url);

  function finishWithHeuristic(text, htmlForMeta){
    var parsed = heuristicParseRecipeText(text || "");
    if(htmlForMeta){
      var titleMatch = htmlForMeta.match(/<title>([^<]*)<\/title>/i);
      if(titleMatch && !parsed.title) parsed.title = titleMatch[1].trim().replace(/\s*[|\u2013-]\s*[^|\u2013-]*$/, '');
    }
    d.title = parsed.title || d.title || "";
    applyMeta(d, parsed);
    d.ingredients = parsed.ingredients.length ? parsed.ingredients : [{name:"",amount:"",unit:""}];
    d.steps = parsed.steps.length ? parsed.steps : [""];
    if(htmlForMeta && !d.cover){
      var imgMatch = htmlForMeta.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i) || htmlForMeta.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
      if(imgMatch){ d.cover = imgMatch[1]; d.coverIsWebLink = true; }
    }
    d.mode = "manual";
    d.loading = false;
    if(!parsed.ingredients.length && !parsed.steps.length){
      d.error = "Couldn't find a structured recipe on that page \u2014 pulled what text I could, so please check it over carefully, or fill it in manually.";
    } else {
      d.error = "Found this with a best-effort, no-AI read of the page \u2014 double-check the ingredients and steps before saving.";
    }
    render();
  }

  fetchRawHtml(url).then(function(html){
    if(!isYouTube){
      var recipe = extractRecipeFromHtml(html);
      if(recipe && (recipe.ingredients.length || recipe.steps.length)){
        d.title = recipe.title || d.title;
        applyMeta(d, recipe);
        d.ingredients = recipe.ingredients.length ? recipe.ingredients : [{name:"",amount:"",unit:""}];
        d.steps = recipe.steps.length ? recipe.steps : [""];
        if(recipe.image && !d.cover){ d.cover = recipe.image; d.coverIsWebLink = true; }
        d.mode = "manual";
        d.loading = false;
        render();
        return;
      }
    }
    /* no structured data found (or YouTube) - get a cleaner read via the reader service, falling back to raw text if that fails */
    var ytDescription = isYouTube ? extractYouTubeDescription(html) : null;
    if(ytDescription){
      finishWithHeuristic(ytDescription, html);
      return;
    }
    fetchReadableText(url).then(function(readable){
      finishWithHeuristic(readable, html);
    }).catch(function(){
      finishWithHeuristic(stripHtmlTags(html).slice(0, 8000), html);
    });
  }).catch(function(){
    /* raw HTML totally unreachable - last resort is the reader service directly */
    fetchReadableText(url).then(function(readable){
      finishWithHeuristic(readable, null);
    }).catch(function(err){
      if(hasCloudStorage()){
        d.error = "This preview only allows network requests to a small approved list of sites, so Local link import can't reach outside pages from in here. It works when this file is downloaded and opened in your own browser instead \u2014 or switch to \u201cAI\u201d above, which does work in this preview.";
      } else {
        d.error = "Couldn't fetch that page after trying a few different ways (" + (err && err.message ? err.message : "network error") + "). It might be a temporary issue with the fetch services this relies on, an ad-blocker/firewall on your end, or the site actively blocking automated access. Try again in a moment, use \u201cType it in\u201d instead, or use AI import if you have a key set up.";
      }
      d.loading = false;
      render();
    });
  });
}

/* ---------- backup export / import ---------- */
function slugify(str){
  return (str||"recipe").toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || "recipe";
}
function downloadJson(obj, filename){
  var blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
/* backups never include API keys, Firebase config, or per-device sync bookkeeping */
function exportableState(){
  var copy = JSON.parse(JSON.stringify(state));
  delete copy.syncMeta;
  if(copy.settings){ delete copy.settings.apiConfig; delete copy.settings.firebaseConfig; }
  return copy;
}
function exportBackup(){
  downloadJson(exportableState(), "recipe-box-backup-" + new Date().toISOString().slice(0,10) + ".json");
}
/* ---------- share links (WhatsApp etc.): the recipe travels inside the link itself ---------- */
function b64urlFromBytes(bytes){
  var bin = ""; for(var i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function bytesFromB64url(str){
  str = str.replace(/-/g, '+').replace(/_/g, '/'); while(str.length % 4) str += '=';
  var bin = atob(str), out = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function shareCompact(r){
  var o = {
    v: 1, t: r.title || "Untitled recipe",
    i: (r.ingredients || []).map(function(x){ return [x.amount || "", x.unit || "", x.name || ""]; }),
    s: r.steps || []
  };
  if(r.tags && r.tags.length) o.g = r.tags;
  if(metaText(r.time)) o.m = metaText(r.time);
  if(metaText(r.servings)) o.y = metaText(r.servings);
  if(r.originalUrl && /^https?:/i.test(r.originalUrl) && r.originalUrl.length < 400) o.u = r.originalUrl;
  if(r.cover && /^https?:/i.test(r.cover) && r.cover.length < 400) o.c = r.cover;   /* uploaded photos are too big for a link */
  return JSON.stringify(o);
}
function shareBase(){ return location.origin + location.pathname; }
function shareLinkPlain(r){
  return shareBase() + '#share=p' + b64urlFromBytes(new TextEncoder().encode(shareCompact(r)));
}
function shareLinkCompressed(r){
  if(typeof CompressionStream === 'undefined') return Promise.resolve(null);
  try{
    var stream = new Blob([new TextEncoder().encode(shareCompact(r))]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Response(stream).arrayBuffer().then(function(buf){
      return shareBase() + '#share=z' + b64urlFromBytes(new Uint8Array(buf));
    });
  }catch(e){ return Promise.resolve(null); }
}
/* worked out ahead of the tap so the button can open WhatsApp instantly (browsers block pop-ups after a wait) */
function warmShareLink(r){
  var sig = shareCompact(r);
  var c = ui.shareLinks[r.id];
  if(c && c.sig === sig) return;
  ui.shareLinks[r.id] = { sig: sig, link: null };
  shareLinkCompressed(r).then(function(link){
    if(link && ui.shareLinks[r.id] && ui.shareLinks[r.id].sig === sig && link.length < shareLinkPlain(r).length) ui.shareLinks[r.id].link = link;
  }).catch(function(){});
}
function randomShareId(){
  var chars = 'abcdefghijkmnpqrstuvwxyz23456789', out = '', a = [];
  try{ a = Array.prototype.slice.call(window.crypto.getRandomValues(new Uint8Array(10))); }catch(e){ for(var i = 0; i < 10; i++) a.push(Math.floor(Math.random() * 256)); }
  a.forEach(function(x){ out += chars.charAt(x % chars.length); });
  return out;
}
/* a short link stores the recipe in your own Firebase project and puts only a tiny id in the link */
function warmShortLink(r){
  if(!syncIsActive()) return;
  var sig = shareCompact(r), c = ui.shortLinks[r.id];
  if(c && c.sig === sig) return;
  var id = randomShareId();
  ui.shortLinks[r.id] = { sig: sig, link: null };
  var writing;
  try{ writing = sync.db.collection('shares').doc(id).set({ owner: sync.user.uid, createdAt: Date.now(), data: sig }); }
  catch(e){ writing = Promise.reject(e); }
  writing.then(function(){
    if(ui.shortLinks[r.id] && ui.shortLinks[r.id].sig === sig) ui.shortLinks[r.id].link = shareBase() + '#s=' + id;
  }).catch(function(){
    delete ui.shortLinks[r.id];
    ui.shortLinkIssue = true;
    if(ui.shareMenu) render();
  });
}
function getShareLink(r){
  var sc = ui.shortLinks[r.id];
  if(sc && sc.link && sc.sig === shareCompact(r)) return sc.link;
  var c = ui.shareLinks[r.id];
  if(c && c.sig === shareCompact(r) && c.link) return c.link;
  return shareLinkPlain(r);
}
function shareNeedsHosting(){
  if(location.protocol === 'file:' || !/^https?:/.test(location.protocol)){
    alert("Share links only work once Recipe Box is opened from its web address (for example your Netlify or GitHub Pages link), not from a downloaded file. Open it from its web address, then try again.");
    return true;
  }
  return false;
}
function shareOnWhatsApp(r){
  if(shareNeedsHosting()) return;
  var msg = '“' + (r.title || 'A recipe') + '” — open this link to add it to your Recipe Box:\n' + getShareLink(r);
  var url = 'https://wa.me/?text=' + encodeURIComponent(msg);
  var w = null;
  try{ w = window.open(url, '_blank'); }catch(e){}
  if(!w) location.href = url;
}
function copyShareLink(r){
  if(shareNeedsHosting()) return;
  var link = getShareLink(r);
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = link; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); alert("Share link copied — paste it in any message."); }
    catch(e){ prompt("Copy this share link:", link); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(function(){ alert("Share link copied — paste it in any message."); }).catch(fallback);
  } else fallback();
}
function recipeFromShareJson(o){
  if(!o || typeof o !== 'object' || typeof o.t !== 'string') return null;
  var ings = (Array.isArray(o.i) ? o.i : []).map(function(x){
    return Array.isArray(x) && x[2] ? { amount: String(x[0] || ""), unit: String(x[1] || ""), name: String(x[2]) } : null;
  }).filter(Boolean);
  var steps = (Array.isArray(o.s) ? o.s : []).map(function(x){ return String(x); }).filter(Boolean);
  if(!ings.length && !steps.length) return null;
  var cover = (typeof o.c === 'string' && /^https?:/i.test(o.c)) ? o.c : null;
  return { title: o.t.trim() || "Untitled recipe", cover: cover, coverIsWebLink: !!cover, ingredients: ings, steps: steps,
    time: metaText(o.m), servings: metaText(o.y),
    tags: filterKnownTags(o.g), originalUrl: (typeof o.u === 'string' && /^https?:/i.test(o.u)) ? o.u : undefined };
}
function decodeShareToken(tok){
  var kind = tok.charAt(0), body = tok.slice(1);
  try{
    var bytes = bytesFromB64url(body);
    if(kind === 'p') return Promise.resolve(recipeFromShareJson(JSON.parse(new TextDecoder().decode(bytes))));
    if(kind === 'z' && typeof DecompressionStream !== 'undefined'){
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Response(stream).arrayBuffer().then(function(buf){
        return recipeFromShareJson(JSON.parse(new TextDecoder().decode(new Uint8Array(buf))));
      });
    }
  }catch(e){}
  return Promise.resolve(null);
}
function clearPendingShare(){
  ui.pendingShare = null; ui.pendingShareId = null;
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ try{ location.hash = ''; }catch(e2){} }
}
function failShareLink(msg){
  alert(msg);
  ui.pendingShareId = null;
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  render();
}
function resolveShareId(){
  var id = ui.pendingShareId;
  if(!id || !syncIsActive() || !sync.ready || ui.pendingShare || ui.resolvingShare) return;
  ui.resolvingShare = true;
  sync.db.collection('shares').doc(id).get().then(function(snap){
    ui.resolvingShare = false;
    if(ui.pendingShareId !== id) return;
    var g = null;
    try{ if(snap.exists) g = recipeFromShareJson(JSON.parse(snap.data().data)); }catch(e){}
    if(!g) return failShareLink("Couldn't open that shared recipe \u2014 the link may be old or have been removed. Ask for it to be sent again.");
    ui.pendingShareId = null;
    ui.pendingShare = { recipe: g };
    render();
  }).catch(function(){
    ui.resolvingShare = false;
    failShareLink("Couldn't open that shared recipe. Check your connection and try the link again \u2014 if it keeps failing, the sender may need to finish setting up short links (Firestore rules).");
  });
}
function checkIncomingShare(){
  var sm = String(location.hash || "").match(/^#s=([a-z0-9]{6,24})$/);
  if(sm){ ui.pendingShareId = sm[1]; render(); resolveShareId(); return; }
  var m = String(location.hash || "").match(/^#share=([A-Za-z0-9_\-]+)$/);
  if(!m) return;
  decodeShareToken(m[1]).then(function(g){
    if(!g){ alert("That share link looks incomplete or damaged — ask for it to be sent again."); try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} return; }
    ui.pendingShare = { recipe: g };
    render();
  }).catch(function(){
    alert("That share link looks incomplete or damaged \u2014 ask for it to be sent again.");
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  });
}
window.addEventListener('hashchange', checkIncomingShare);
document.addEventListener('click', function(e){
  if(ui.shareMenu && !(e.target.closest && e.target.closest('.menu-wrap'))){ ui.shareMenu = false; render(); }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && ui.shareMenu){ ui.shareMenu = false; render(); }
});

function exportSingleRecipe(r){
  var shareable = {
    recipeBoxShare: true,
    title: r.title, time: r.time || "", servings: r.servings || "", cover: r.cover, coverIsWebLink: !!r.coverIsWebLink,
    ingredients: r.ingredients || [], steps: r.steps || [],
    tags: r.tags || [], originalUrl: r.originalUrl
  };
  downloadJson(shareable, slugify(r.title) + ".json");
}
function recipeToPlainText(r){
  var lines = [r.title || "Untitled recipe", ""];
  var mt = [metaText(r.time) ? "Time: " + metaText(r.time) : "", servingsLabel(r.servings)].filter(Boolean).join(" \u00b7 ");
  if(mt){ lines.push(mt); lines.push(""); }
  lines.push("Ingredients:");
  (r.ingredients||[]).forEach(function(i){
    lines.push("- " + [i.amount, i.unit, i.name].filter(function(x){ return x; }).join(" "));
  });
  lines.push("");
  lines.push("Method:");
  (r.steps||[]).forEach(function(s, idx){ lines.push((idx+1) + ". " + s); });
  if(r.originalUrl){ lines.push(""); lines.push("Source: " + r.originalUrl); }
  return lines.join("\n");
}
function copyRecipeAsText(r){
  var text = recipeToPlainText(r);
  function fallbackCopy(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{ document.execCommand('copy'); alert("Recipe copied as text \u2014 paste it anywhere."); }
    catch(e){ alert("Couldn't copy automatically. Here's the text to copy manually:\n\n" + text); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      alert("Recipe copied as text \u2014 paste it anywhere.");
    }).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}
/* ---------- paste-text import ---------- */
function extractFromTextLocal(){
  var d = ui.draft;
  syncDraftFromDom();
  if(!d.pasteText.trim()){ d.error = "Paste some recipe text first."; render(); return; }
  var parsed = heuristicParseRecipeText(d.pasteText);
  if(!parsed.ingredients.length && !parsed.steps.length){
    d.error = "Couldn't spot any ingredients or method in that text. Try adding \u201cIngredients\u201d and \u201cMethod\u201d headings, or switch to the AI option.";
    render(); return;
  }
  d.title = parsed.title || d.title || "";
  applyMeta(d, parsed);
  d.ingredients = parsed.ingredients.length ? parsed.ingredients : [{name:"",amount:"",unit:""}];
  d.steps = parsed.steps.length ? parsed.steps : [""];
  if(parsed.tags && parsed.tags.length) d.tags = parsed.tags;
  d.mode = "manual";
  d.error = "Worked this out from your text without AI \u2014 have a quick look over the ingredients and steps before saving.";
  render();
}

function extractFromText(){
  var d = ui.draft;
  syncDraftFromDom();
  if(!d.pasteText.trim()){ d.error = "Paste some recipe text first."; render(); return; }
  d.loading = true; d.error = "";
  render();
  var prompt = "Below is text that contains a recipe (it may be messy: copied from a web page, a message, an email or a caption). Turn it into a clean recipe. Respond with ONLY valid JSON, no markdown fences, no preamble, in this exact shape:\n" +
    '{"title": "...", "time": "total time e.g. 45 min, or empty if unknown", "servings": "number of portions e.g. 4, or empty if unknown", "ingredients": [{"name":"...","amount":"...","unit":"..."}], "steps": ["...","..."], "tags": ["choose from: ' + ALL_TAGS.join(", ") + '"]}\n' +
    "Keep amounts and units as written. Drop adverts, comments and unrelated text. Keep steps concise, in order, without numbering.\n\nTEXT:\n" + d.pasteText.slice(0, 12000);
  runAI({ prompt: prompt, images: [], useWebSearch: false }).then(function(text){
    var parsed = parseJsonLoose(text);
    var ings = ((parsed && parsed.ingredients) || []).map(toIngredientObj).filter(Boolean);
    var steps = toStepStrings(parsed && parsed.steps);
    if(!ings.length && !steps.length) throw new Error("no recipe found");
    d.title = (parsed.title || "").toString();
    applyMeta(d, parsed);
    d.ingredients = ings.length ? ings : [{name:"",amount:"",unit:""}];
    d.steps = steps.length ? steps : [""];
    d.tags = filterKnownTags(parsed.tags);
    d.mode = "manual";
    if(!d.cover && d.title){
      return autoFindCoverPhoto(d.title).then(function(url){
        if(url){ d.cover = url; d.coverIsWebLink = true; }
      }).catch(function(){ /* non-fatal */ });
    }
  }).then(function(){
    d.loading = false; render();
  }).catch(function(err){
    d.error = friendlyErrorMessage(err, "Couldn't turn that into a recipe. Try again, or use the Local option.");
    d.loading = false; render();
  });
}

/* ---------- .json import ---------- */
function stripHtml(v){
  return String(v == null ? "" : v)
    .replace(/<br\s*\/?>/gi, '\n').replace(/<\/(?:p|li|div)>/gi, '\n').replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#0?39;|&apos;/g, "'").replace(/&amp;/g, '&')
    .replace(/[ \t]+/g, ' ').replace(/ *\n */g, '\n').trim();
}
function filterKnownTags(tags){
  if(typeof tags === 'string') tags = tags.split(/[,;|]/);
  if(!Array.isArray(tags)) return [];
  var out = [];
  tags.forEach(function(t){
    var low = String(t).trim().toLowerCase();
    ALL_TAGS.forEach(function(k){ if(k.toLowerCase() === low && out.indexOf(k) === -1) out.push(k); });
  });
  return out;
}
function toIngredientObj(x){
  if(x == null) return null;
  if(typeof x === 'string' || typeof x === 'number'){
    var t = stripHtml(x);
    return t ? parseIngredientLine(t) : null;
  }
  if(typeof x !== 'object') return null;
  var name = x.name || x.ingredient || x.item || x.text || x.title || x.description;
  if(!name) return null;
  var amount = x.amount != null ? x.amount : (x.quantity != null ? x.quantity : (x.qty != null ? x.qty : ""));
  var unit = x.unit || x.measure || x.units || "";
  name = stripHtml(name);
  if(!name) return null;
  if(amount === "" && unit === "" && /^[\d\u00bc\u00bd\u00be]/.test(name)) return parseIngredientLine(name);
  return { name: name, amount: String(amount).trim(), unit: String(unit).trim() };
}
function toIngredientList(v){
  if(typeof v === 'string') v = stripHtml(v).split(/\n+/);
  if(!Array.isArray(v)) return [];
  return v.map(toIngredientObj).filter(function(i){ return i && i.name; });
}
function toStepStrings(v){
  var out = [];
  (function walk(x){
    if(x == null) return;
    if(typeof x === 'string'){
      stripHtml(x).split(/\n+/).forEach(function(line){
        line = cleanStepLine(line);
        if(line) out.push(line);
      });
    } else if(Array.isArray(x)){ x.forEach(walk); }
    else if(typeof x === 'object'){
      if(x.itemListElement) walk(x.itemListElement);
      else walk(x.text || x.step || x.instruction || x.description || x.name);
    }
  })(v);
  return out;
}
function genericRecipeFromObject(o){
  if(!o || typeof o !== 'object' || Array.isArray(o)) return null;
  var title = o.title || o.name || o.recipeName || o.recipe_name || o.headline;
  if(typeof title !== 'string' || !title.trim()) return null;
  var rawIng = o.ingredients || o.recipeIngredient || o.ingredient || o.ingredientList || o.ingredients_list;
  var rawSteps = o.steps || o.recipeInstructions || o.instructions || o.method || o.directions || o.preparation;
  var ings = toIngredientList(rawIng);
  var steps = toStepStrings(rawSteps);
  if(!ings.length && !steps.length) return null;
  var coverRaw = jsonLdImageToUrl(o.cover || o.image || o.photo || o.thumbnail || o.imageUrl);
  var cover = (typeof coverRaw === 'string' && /^(?:https?:|data:image\/)/i.test(coverRaw)) ? coverRaw : null;
  var src = o.originalUrl || o.sourceUrl || o.url || o.source;
  return {
    title: stripHtml(title) || "Untitled recipe",
    cover: cover,
    coverIsWebLink: !!cover && /^https?:/i.test(cover),
    ingredients: ings, steps: steps,
    time: isoToTime(o.time || o.totalTime || o.cookTime || o.prepTime), servings: yieldText(o.servings || o.recipeYield || o.yield || o.serves || o.portions),
    tags: filterKnownTags(o.tags || o.keywords || o.recipeCategory),
    originalUrl: (typeof src === 'string' && /^https?:/i.test(src)) ? src : undefined
  };
}
function collectRecipesFromJson(j, out, depth){
  if(j == null || depth > 4) return;
  if(Array.isArray(j)){ j.forEach(function(x){ collectRecipesFromJson(x, out, depth + 1); }); return; }
  if(typeof j !== 'object') return;
  var g = genericRecipeFromObject(j);
  if(g){ out.push(g); return; }
  if(j["@graph"]) collectRecipesFromJson(j["@graph"], out, depth + 1);
  ["recipes", "items", "data", "results", "recipe", "recipeList", "collection", "book"].forEach(function(k){
    if(j[k]) collectRecipesFromJson(j[k], out, depth + 1);
  });
}
function isRecipeBoxBackup(j){
  if(!j || Array.isArray(j) || !Array.isArray(j.recipes)) return false;
  if(j.recipes.length === 0) return Array.isArray(j.pantry) || Array.isArray(j.shopping);
  return j.recipes.every(function(r){ return r && typeof r.title === 'string' && Array.isArray(r.ingredients) && Array.isArray(r.steps); });
}
function mergeBackup(imported){
  var haveRecipe = {};
  state.recipes.forEach(function(r){ haveRecipe[r.id] = true; });
  var incoming = (imported.recipes || []).filter(function(r){
    if(!r.id) r.id = uid();
    r.makePhotos = r.makePhotos || []; r.tags = r.tags || []; r.createdAt = r.createdAt || Date.now();
    return !haveRecipe[r.id];
  });
  state.recipes = incoming.concat(state.recipes);
  if(state.pantry.length === 0) state.pantry = imported.pantry || [];
  var haveShop = {};
  state.shopping.forEach(function(x){ haveShop[x.id] = true; });
  state.shopping = state.shopping.concat((imported.shopping || []).filter(function(x){ return !haveShop[x.id]; }));
  if(imported.settings){
    state.settings = Object.assign({}, imported.settings, {
      apiConfig: state.settings.apiConfig,
      firebaseConfig: state.settings.firebaseConfig
    });
  }
  ui.apiDraft = null;
  return incoming.length;
}
function recipeKey(r){ return (r.title || "").trim().toLowerCase() + "|" + ((r.steps && r.steps[0]) || "").trim().toLowerCase(); }
function addImportedRecipes(list){
  var have = {};
  state.recipes.forEach(function(r){ have[recipeKey(r)] = true; });
  var added = 0, skipped = 0;
  list.slice().reverse().forEach(function(g){
    var key = recipeKey(g);
    if(have[key]){ skipped++; return; }
    have[key] = true; added++;
    state.recipes.unshift({
      id: uid(), createdAt: Date.now(), title: g.title, time: g.time || "", servings: g.servings || "", cover: g.cover, coverIsWebLink: !!g.coverIsWebLink,
      ingredients: g.ingredients, steps: g.steps, tags: g.tags || [], makePhotos: [], originalUrl: g.originalUrl
    });
  });
  return { added: added, skipped: skipped };
}
function loadRecipeIntoForm(g){
  var d = ui.draft;
  d.title = g.title; d.time = g.time || ""; d.servings = g.servings || ""; d.cover = g.cover; d.coverIsWebLink = !!g.coverIsWebLink;
  d.ingredients = g.ingredients.length ? g.ingredients : [{name:"",amount:"",unit:""}];
  d.steps = g.steps.length ? g.steps : [""];
  d.tags = (g.tags || []).slice();
  d.url = g.originalUrl || "";
  d.mode = "manual";
  d.error = "Loaded from the file \u2014 check it over, then save.";
}
function readJsonFile(file, fromModal){
  var reader = new FileReader();
  reader.onerror = function(){ if(fromModal){ ui.draft.error = "Couldn't read that file."; render(); } else alert("Couldn't read that file."); };
  reader.onload = function(ev){
    var msg = "", j = null;
    try{ j = JSON.parse(String(ev.target.result).replace(/^\uFEFF/, '')); }
    catch(err){ msg = "That file isn't valid JSON."; }
    if(!msg){
      if(isRecipeBoxBackup(j)){
        var n = mergeBackup(j);
        if(fromModal){ ui.showAdd = false; ui.editingRecipeId = null; }
        saveState();
        alert("Backup imported \u2014 " + n + " new recipe" + (n === 1 ? "" : "s") + " merged into your collection.");
        return;
      }
      var found = [];
      collectRecipesFromJson(j, found, 0);
      if(!found.length){
        msg = "Couldn't find a recipe in that file. It needs a title plus ingredients and/or steps (a Recipe Box backup or shared recipe, or schema.org Recipe data, all work).";
      } else if(found.length === 1 && fromModal){
        loadRecipeIntoForm(found[0]);
        render();
        return;
      } else {
        var res = addImportedRecipes(found);
        if(fromModal){ ui.showAdd = false; ui.editingRecipeId = null; }
        saveState();
        if(res.added === 1 && found.length === 1) alert('"' + found[0].title + '" was added to your recipes.');
        else alert(res.added + " recipe" + (res.added === 1 ? "" : "s") + " added" + (res.skipped ? " (" + res.skipped + " already in your collection, skipped)." : "."));
        return;
      }
    }
    if(fromModal){ ui.draft.error = msg; render(); } else alert(msg);
  };
  reader.readAsText(file);
}

function importBackup(e){
  var file = e.target.files[0];
  if(!file) return;
  readJsonFile(file, false);
  e.target.value = "";
}

loadState();
setTimeout(function(){ if(!ui.loaded){ ui.loaded = true; render(); } }, 6000);
})();
